name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Inspect exact Run 240 mutex spec, implementation and linked instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree evidence/source
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          echo "=== lck_mtx_init and init_ext exact source ==="
          grep -n 'lck_mtx_init_ext\|lck_mtx_init(' evidence/source/xnu/osfmk/kern/locks.c | tail -25
          python3 - <<'PY'
          import pathlib
          s = pathlib.Path("evidence/source/xnu/osfmk/kern/locks.c").read_text().splitlines()
          for term in ("lck_mtx_init_ext(", "lck_mtx_init("):
              hits=[i for i,x in enumerate(s) if term in x]
              print(f"--- {term}: {hits[-5:]} ---")
              for i in hits[-3:]:
                  lo=max(0,i-8); hi=min(len(s),i+75)
                  print("\n".join(f"{j+1}: {s[j]}" for j in range(lo,hi)))
          PY
          echo "=== spec macro ==="
          sed -n '170,198p' evidence/source/xnu/osfmk/kern/lock_mtx.h
          echo "=== lock group init ==="
          grep -n -A 55 -B 8 'lck_grp_startup_init\|lck_group_init' evidence/source/xnu/osfmk/kern/lock_group.c | head -150
          echo "=== exact mutex/group symbols ==="
          grep -E 'processor_updown|_lck_mtx_startup_init|_lck_mtx_init|_lck_grp_startup_init|_lck_grp_init|_lck_mod_init' evidence/kernel/kernel.nm || true
          echo "=== target startup spec data bytes ==="
          xcrun otool -l evidence/kernel/kernel.development.lavender > evidence/kernel/load.txt
          python3 - <<'PY'
          import pathlib,re,struct
          p=pathlib.Path("evidence/kernel/load.txt").read_text().splitlines()
          segs=[]
          for i,line in enumerate(p):
              if line.strip()=="cmd LC_SEGMENT_64":
                  d={}
                  for x in p[i+1:i+12]:
                      m=re.match(r"\s*(segname|vmaddr|vmsize|fileoff|filesize)\s+(\S+)",x)
                      if m:d[m.group(1)]=m.group(2)
                  if len(d)==5:segs.append(d)
          va=0xfffffe0007be9d08
          data=pathlib.Path("evidence/kernel/kernel.development.lavender").read_bytes()
          for s in segs:
              base=int(s["vmaddr"],16); size=int(s["filesize"],0)
              if base<=va<base+size:
                  off=int(s["fileoff"],0)+(va-base)
                  raw=data[off:off+24]
                  vals=struct.unpack("<QQQ",raw)
                  print("segment",s,"spec_file_offset",hex(off),"raw",raw.hex())
                  print("spec fields lock/group/attr:",*[hex(x) for x in vals])
                  break
          else: raise SystemExit("processor_updown_lock startup spec VA not covered by file-backed segment")
          PY
          echo "=== disassembly of exact lock initializers and called helpers ==="
          for sym in _lck_mtx_startup_init _lck_mtx_init _lck_mtx_init_ext _lck_grp_startup_init _lck_grp_init; do
            echo "--- $sym ---"
            xcrun otool -tvV -p "$sym" evidence/kernel/kernel.development.lavender 2>&1 | head -120 || true
          done
          echo "=== ARM atomic/system instructions in lck_mtx initializer functions (raw range from disassembly) ==="
          grep -n -A 100 -B 2 'lck_mtx_startup_init\|lck_mtx_init_ext\|lck_mtx_init' evidence/kernel/KERNEL-DISASSEMBLY.txt | head -300 || true
