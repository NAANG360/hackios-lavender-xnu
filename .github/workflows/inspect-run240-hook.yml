name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download immutable Run 240 artifacts and unpack source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          test -s evidence/buildtree/buildtree.tgz
          mkdir -p evidence/source
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          echo "=== XNU SOURCES ==="
          find evidence/source -type f \( -path '*/bsd/kern/qsort.c' -o -path '*/osfmk/kern/startup.c' -o -path '*/osfmk/kern/locks.c' \) -print
          echo "=== QSORT SOURCE ==="
          qsort_source="$(find evidence/source -type f -path '*/bsd/kern/qsort.c' -print -quit)"
          test -n "$qsort_source"
          sed -n '1,260p' "$qsort_source"
          echo "=== LOCK STARTUP SOURCE HITS ==="
          rg -n -C 3 'STARTUP\(LOCKS|lck_.*startup_init|SIMPLE_LOCK_DECLARE' evidence/source --glob '*.[ch]' | head -180
          echo "=== KERNEL SYMBOLS ==="
          xcrun nm -nm evidence/kernel/kernel.development.lavender > evidence/kernel/kernel.nm
          rg 'lck_.*startup_init|startup_entry_cmp|kernel_startup_initialize_upto|_qsort' evidence/kernel/kernel.nm | head -100
          echo "=== SECTION LOAD COMMANDS ==="
          rg -n -A 8 -B 3 'init_entry_set|__BOOTDATA' evidence/kernel/MACHO-LOAD-COMMANDS.txt | head -80
