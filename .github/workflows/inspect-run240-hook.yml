name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download Run 240 artifacts and inspect processor_updown_lock path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree evidence/source
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          echo "=== lck_mtx_startup_init source ==="
          sed -n '3220,3275p' evidence/source/xnu/osfmk/kern/locks.c
          echo "=== mutex startup spec macro and struct ==="
          grep -R -n -B 12 -A 18 'lck_mtx_startup_spec\|STARTUP_RANK_FOURTH\|LCK_MTX_DECLARE' evidence/source/xnu/osfmk/kern/lock_mtx.h evidence/source/xnu/osfmk/kern/locks.h evidence/source/xnu/osfmk/kern/processor.c
          echo "=== processor_updown_lock declaration and usage ==="
          grep -R -n -B 12 -A 20 'processor_updown_lock' evidence/source/xnu/osfmk evidence/source/xnu/bsd
          echo "=== related mutex init implementation ==="
          grep -n -E '^lck_mtx_init_ext|^lck_mtx_init\(|^lck_mtx_init_lock_group|^lck_mtx_init_grp' evidence/source/xnu/osfmk/kern/locks.c
          echo "=== kernel symbol neighborhoods ==="
          grep -n -A 5 -B 5 '_lck_mtx_startup_init\|_lck_mtx_init_ext\|_lck_mtx_init' evidence/kernel/KERNEL-DISASSEMBLY.txt | head -160
          echo "=== kernel disassembly header around mutex startup init ==="
          xcrun otool -tvV evidence/kernel/kernel.development.lavender > evidence/kernel/otool-disassembly.txt
          grep -n -A 90 -B 5 '_lck_mtx_startup_init' evidence/kernel/otool-disassembly.txt | head -120
          echo "=== relevant symbol starts ==="
          grep -E '_lck_mtx_startup_init|_lck_mtx_init_ext|_lck_mtx_init$|_lck_grp_init' evidence/kernel/kernel.nm || true
          echo "=== architecture compile flags ==="
          grep -R -n -E -- '-mcpu=|-march=| -target |armv8\.[0-9]' evidence/source 2>/dev/null | head -100 || true
