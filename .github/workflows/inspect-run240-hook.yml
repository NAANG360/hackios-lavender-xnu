name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Read exact mutex and group initialization implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree evidence/source
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path("evidence/source/xnu")
          selections={
            "osfmk/kern/lock_group.c":[("lck_grp_init_flags(",55),("lck_grp_reference(",45),("lck_grp_startup_init(",40)],
            "osfmk/kern/lock_mtx.c":[("lck_mtx_init(",28)],
            "osfmk/kern/locks.c":[("lck_mod_init(",60)],
            "osfmk/kern/lock_group.h":[("LCK_GRP_DECLARE",20),("lck_grp_reference(",30)],
            "osfmk/kern/lock_mtx.h":[("LCK_MTX_DECLARE_ATTR",24),("extern void             lck_mtx_init",20)],
          }
          for rel,terms in selections.items():
            p=root/rel
            lines=p.read_text(errors="replace").splitlines()
            print(f"\n===== {rel} =====")
            printed=set()
            for term,after in terms:
              for i,line in enumerate(lines):
                if term in line:
                  lo=max(0,i-12); hi=min(len(lines),i+after)
                  if (lo,hi) in printed: continue
                  printed.add((lo,hi))
                  print(f"--- {term} at {i+1} ---")
                  print("\n".join(f"{j+1}: {lines[j]}" for j in range(lo,hi)))
          PY
          echo "=== relevant build-target feature macros ==="
          grep -n 'MACHINE_FLAGS_ARM64_LAVENDER' evidence/source/xnu/makedefs/MakeInc.def
          echo "=== symbol-scoped otool disassembly ==="
          for sym in _lck_mtx_init _lck_grp_reference _lck_grp_init_flags _lck_grp_startup_init; do
            echo "--- $sym ---"
            xcrun otool -arch arm64 -tvV -p "$sym" evidence/kernel/kernel.development.lavender 2>&1 | head -90 || true
          done
