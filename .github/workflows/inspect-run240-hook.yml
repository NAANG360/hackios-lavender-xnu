name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download immutable Run 240 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          echo "=== KERNEL ARTIFACT FILES ==="
          find evidence/kernel -type f -maxdepth 4 -print
          echo "=== BUILDTREE ARTIFACT FILES (first 100) ==="
          find evidence/buildtree -type f -maxdepth 6 -print | head -100
          echo "=== EXACT XNU QSORT SOURCE CANDIDATES ==="
          find evidence/buildtree -type f -path '*/bsd/kern/qsort.c' -print
          echo "=== KERNEL SYMBOL TOOLS ==="
          xcrun --find nm
          xcrun --find otool
