name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Inspect group reference and exact lock startup data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree evidence/source
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("evidence/source/xnu")
          print("=== ALL DEFINITIONS/DECLARATIONS/CALLS OF lck_grp_reference ===")
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix not in (".c",".h",".s",".S"): continue
              try: lines=p.read_text(errors="ignore").splitlines()
              except OSError: continue
              for i,line in enumerate(lines):
                  if re.search(r"\blck_grp_reference\s*\(",line):
                      print(f"--- {p}:{i+1} ---")
                      print("\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,i-12),min(len(lines),i+30))))
          print("=== LOCK GROUP INIT EARLY BOOTSTRAP ===")
          p=root/"osfmk/kern/lock_group.c"; lines=p.read_text(errors="replace").splitlines()
          print("\n".join(f"{j+1}: {lines[j]}" for j in range(1,min(len(lines),260))))
          print("=== PROCESSOR GROUP DECLARATION CONTEXT ===")
          p=root/"osfmk/kern/processor.c"; lines=p.read_text(errors="replace").splitlines()
          for i,line in enumerate(lines):
              if "processor_updown_grp" in line or "processor_updown_lock" in line:
                  print("\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,i-8),min(len(lines),i+12))))
          print("=== LINKED LOCK SYMBOLS ===")
          import subprocess
          nm=subprocess.check_output(["xcrun","nm","-an","evidence/kernel/kernel.development.lavender"],text=True)
          for line in nm.splitlines():
              if any(x in line for x in ("lck_grp_reference","lck_grp_deallocate","lck_mtx_init","lck_grp_init_flags","processor_updown")):
                  print(line)
          PY
          echo "=== FULL ARM64 TEXT DISASSEMBLY ==="
          xcrun otool -arch arm64 -tvV evidence/kernel/kernel.development.lavender > evidence/kernel/otool-text.txt
          python3 - <<'PY'
          import pathlib,re
          lines=pathlib.Path("evidence/kernel/otool-text.txt").read_text(errors="replace").splitlines()
          print("text lines:",len(lines))
          for sym in ("_lck_grp_reference","_lck_mtx_init","_lck_grp_init_flags","_lck_grp_startup_init"):
              hits=[i for i,x in enumerate(lines) if sym in x]
              print(f"\n=== {sym}: {hits[:6]} ===")
              for i in hits[:2]:
                  print("\n".join(lines[max(0,i-2):min(len(lines),i+90)]))
          PY
          echo "=== startup table mapping and source identity ==="
          shasum -a 256 evidence/kernel/kernel.development.lavender
