name: Inspect Run 240 startup hook

on:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/inspect-run240-hook.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Resolve processor mutex pointers and inspect lck_mtx_init call chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/kernel evidence/buildtree evidence/source
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14159918757/zip" -o kernel.zip
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14160182439/zip" -o buildtree.zip
          unzip -q kernel.zip -d evidence/kernel
          unzip -q buildtree.zip -d evidence/buildtree
          tar -xzf evidence/buildtree/buildtree.tgz -C evidence/source
          echo "=== ALL IMPLEMENTATIONS/CALLS OF lck_mtx_init ==="
          grep -R -n -B 8 -A 55 'lck_mtx_init_ext\|lck_mtx_init(' evidence/source/xnu/osfmk evidence/source/xnu/bsd 2>/dev/null | head -500 || true
          echo "=== processor_updown group init declaration ==="
          grep -R -n -B 8 -A 22 'processor_updown_grp' evidence/source/xnu/osfmk 2>/dev/null || true
          echo "=== symbols (including local) ==="
          xcrun nm -an evidence/kernel/kernel.development.lavender > evidence/kernel/kernel.nm
          grep -E 'processor_updown|lck_mtx_init|lck_grp_init|lck_mtx_startup_init|lck_grp_startup_init' evidence/kernel/kernel.nm | head -120 || true
          echo "=== resolve exact spec field pointers to symbols ==="
          python3 - <<'PY'
          import bisect,pathlib,re
          p=pathlib.Path("evidence/kernel/kernel.nm")
          syms=[]
          for line in p.read_text(errors="replace").splitlines():
              m=re.match(r"^\s*([0-9a-fA-F]{8,16})\s+([A-Za-z])\s+(.+?)\s*$",line)
              if m and m.group(2).upper()!="U":
                  syms.append((int(m.group(1),16),m.group(3)))
          syms.sort()
          for name,addr in [("mutex",0xfffffe0007b10718),("group",0xfffffe0007ac5ec0),("spec",0xfffffe0007be9d08)]:
              i=bisect.bisect_right(syms,(addr,chr(0x10ffff)))-1
              j=bisect.bisect_left(syms,(addr,""))
              exact=syms[j:j+6]
              prev=f"{syms[i][1]} + 0x{addr-syms[i][0]:x}" if i>=0 else "unresolved"
              print(name,hex(addr),"nearest",prev,"next/exact",exact)
          PY
          echo "=== disassemble symbol table and lock code ==="
          xcrun llvm-objdump --version | head -5
          xcrun llvm-objdump --macho --disassemble --symbolize-operands --no-show-raw-insn --disassemble-symbols=_lck_mtx_startup_init,_lck_mtx_init,_lck_mtx_init_ext,_lck_grp_startup_init evidence/kernel/kernel.development.lavender 2>&1 | head -500 || true
          echo "=== kernel verifier disassembly references ==="
          grep -n -i -A 45 -B 4 'lck_mtx_init\|lck_grp_init\|processor_updown' evidence/kernel/KERNEL-DISASSEMBLY.txt | head -300 || true
          echo "=== source compilation configuration hints ==="
          grep -R -n -E -- '-mcpu=|-march=|-target |armv8\.[0-9]' evidence/source/xnu evidence/buildtree 2>/dev/null | head -150 || true
