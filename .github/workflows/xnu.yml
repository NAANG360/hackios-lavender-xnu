name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: Target machine profile (LAVENDER is the active bring-up target; SWEET is reference-only)
        type: choice
        options:
          - LAVENDER
          - SWEET
        default: LAVENDER
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, ci/lavender-machine-profile]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "tools/validate-lavender-profile.sh"

# Each run receives a unique group so concurrent dispatches cannot cancel builds.
concurrency:
  group: xnu-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'LAVENDER' }}

jobs:
  build:
    # macos-14 was retired Nov 2 2026. macos-15-intel is the supported x64 successor.
    # This image supplies Xcode 16.0; its iig ABI differs from Xcode 15, so this
    # first pass intentionally captures the resulting XNU 8796 compatibility diagnostics.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runner and select Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.0.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Fetch pinned XNU build tooling
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is arm64e-only upstream; the reference and Lavender
          # targets are plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Validate selected machine profile
        run: bash tools/validate-lavender-profile.sh "$MACHINE_CONFIG"

      - name: Install build dependencies
        run: |
          brew install jq gum bash cmake ninja
          # darwin-xnu-build checks for xcodes; Xcode is selected explicitly above.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

      - name: Build XNU 8796
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: set -o pipefail; bash build.sh 2>&1 | tee ../xnu-build.log


      - name: Require Lavender XNU entry-guard patch
        if: success() && env.MACHINE_CONFIG == 'LAVENDER'
        run: |
          set -euo pipefail
          grep -q 'LAVENDER_XNU_GUARD_2026' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'Llavender_stage1_pixel' dxb/xnu/osfmk/arm64/start.s
          grep -q 'sweet_early_guard_init' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'sweet_early_map_final' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -q 'sweet_early_logo' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'sweet_early_logo();' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'lavender_guard_mark 7' dxb/xnu/osfmk/arm64/start.s
          grep -q '#if !VMAPPLE && !defined(KERNEL_INTEGRITY_KTRR)' dxb/xnu/osfmk/arm64/start.s
          grep -q 'SPMI_OP_EXT_READL' shim/lavender_guardian.c
          grep -q 'QCOM_WDT_BASE 0x17817000' shim/lavender_guardian.c
          grep -q 'WDT0_BITE_TIME 0x14' shim/lavender_guardian.c

      - name: Upload XNU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-log
          path: xnu-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package build tree for local compilation
        if: always()
        run: |
          if [[ -d dxb/build/xnu.obj && -d dxb/xnu && -d dxb/fakeroot/usr/local/include ]]; then
            SDK=$(xcrun --sdk macosx --show-sdk-path)
            mkdir -p sdk-kernel-platform
            cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
            tar czf buildtree.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
              --exclude='kernel.development.*' --exclude='.git' \
              -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
              -C .. sdk-kernel-platform
            ls -lh buildtree.tgz
          else
            echo "No generated XNU tree exists; build failed before compilation, skipping build-tree package."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect closed KDK support libraries
        if: always()
        run: |
          mkdir -p out/kdk-libs
          : > out/kdk-libs/arch.txt
          shopt -s nullglob
          libs=(/Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a)
          for lib in "${libs[@]}"; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect kernel outputs
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          if [[ -s out/kernel.development.lavender ]]; then
            (cd out && shasum -a 256 kernel.development.lavender > SHA256SUMS)
          fi


      - name: Verify Lavender kernel artifact
        if: success()
        run: |
          set -euo pipefail
          kernel=out/kernel.development.lavender
          test -s "$kernel"
          file "$kernel" | tee out/KERNEL-VERIFICATION.txt
          python3 - "$kernel" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          if len(data) < 32:
              raise SystemExit("kernel is shorter than a Mach-O 64-bit header")
          magic, cputype, cpusubtype, filetype, ncmds, sizeofcmds, flags, reserved = struct.unpack_from("<IiiIIIII", data)
          if magic != 0xFEEDFACF:
              raise SystemExit(f"unexpected Mach-O magic: 0x{magic:08x}")
          if cputype != 0x0100000C:
              raise SystemExit(f"kernel is not ARM64 (cputype=0x{cputype:08x})")
          if filetype != 2:
              raise SystemExit(f"expected MH_EXECUTE (filetype={filetype})")
          required = (b"LavenderPlatformExpert", b"qcom,sdm660-mtp", b"Redmi Note 7")
          missing = [item.decode() for item in required if item not in data]
          if missing:
              raise SystemExit("missing Lavender identity strings: " + ", ".join(missing))
          result = (
              f"PASS: Mach-O 64-bit ARM64 executable; size={len(data)} bytes; "
              f"ncmds={ncmds}; flags=0x{flags:08x}; "
              "LavenderPlatformExpert, qcom,sdm660-mtp, Redmi Note 7 present"
          )
          print(result)
          Path("out/KERNEL-VERIFICATION.txt").write_text(result + "\\n", encoding="utf-8")
          PY
          shasum -a 256 "$kernel" | tee out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: error
