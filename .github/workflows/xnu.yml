name: xnu

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: Target machine profile (LAVENDER is the active bring-up target; SWEET is reference-only)
        type: choice
        options:
          - LAVENDER
          - SWEET
        default: LAVENDER
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "false"
  push:
    branches: [main, ci/lavender-machine-profile]
    paths:
      - "xnu/patches/**"
      - "shim/**"
      - ".github/workflows/xnu.yml"
      - ".github/workflows/lavender-shim.yml"
      - ".github/workflows/package-lavender.yml"
      - "tools/validate-lavender-profile.sh"
      - "tools/fix-lavender-pre-vbar.py"
      - "tools/verify-lavender-kernel.py"
      - "tools/mkadt-lavender.py"
      - "tools/mkpayload.py"
      - "tools/extract_appended_fdt.py"
      - "tools/unpack_bootv2.py"
      - "tools/adt.py"
      - "tests/test_lavender_adt.py"

# Give each commit its own run group; diagnostic fix commits must not cancel
# an active XNU build before its logs and artifacts can be inspected.
concurrency:
  group: xnu-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'LAVENDER' }}

jobs:
  build:
    # macos-14 was retired Nov 2 2026. macos-15-intel is the supported x64 successor.
    # This image supplies Xcode 16.0; its iig ABI differs from Xcode 15, so this
    # first pass intentionally captures the resulting XNU 8796 compatibility diagnostics.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runner and select Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.0.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Fetch pinned XNU build tooling
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # Keep upstream 0104 in the patch chain: final 0106 deliberately
          # overrides its first-entry logo and moves the draw after arm_vm_init.
          # The pinned upstream script hardcodes -j8; use every logical CPU
          # exposed by the hosted runner for its major build steps.
          sed -i '' 's/make install -j8/make install -j"${XNU_MAKE_JOBS:-8}"/g' dxb/build.sh
          # Run a deterministic post-patch source guard from the repo tools.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("dxb/build.sh")
          source = path.read_text()
          old = "    patches" + chr(10) + "    venv"
          new = ("    patches" + chr(10) +
                 "    python3 ../tools/fix-lavender-pre-vbar.py" + chr(10) +
                 '    if [ "$MACHINE_CONFIG" = "LAVENDER" ]; then' + chr(10) +
                 "        touch xnu/osfmk/arm64/start.s xnu/osfmk/arm64/sweet_early.c xnu/osfmk/arm/arm_init.c xnu/osfmk/kern/startup.c" + chr(10) +
                 "    fi" + chr(10) +
                 "    venv")
          if old not in source:
              raise SystemExit("pinned build.sh main() patch/venv insertion point changed")
          path.write_text(source.replace(old, new, 1))
          PY
          # libfirehose_kernel is arm64e-only upstream; the reference and Lavender
          # targets are plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Validate selected machine profile
        run: bash tools/validate-lavender-profile.sh "$MACHINE_CONFIG"

      # v2 cache: only binary-verified kernels are accepted as exact hits. Legacy-prefix restores are object-cache inputs only.
      - name: Restore exact-match XNU build cache
        id: xnu-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dxb/build
            dxb/fakeroot
          key: xnu8796-v4-armv8a-${{ inputs.macos_version || '13.5' }}-${{ inputs.kernel_config || 'DEVELOPMENT' }}-${{ inputs.machine_config || 'LAVENDER' }}-macos15-xcode16-dxb-663906528d1cd5ea8fde7de6f16de73db9511549-${{ hashFiles('xnu/patches/*.patch', 'xnu/patches/*.sh', 'tools/fix-lavender-pre-vbar.py') }}
          restore-keys: |
            xnu8796-v4-armv8a-${{ inputs.macos_version || '13.5' }}-${{ inputs.kernel_config || 'DEVELOPMENT' }}-${{ inputs.machine_config || 'LAVENDER' }}-macos15-xcode16-dxb-663906528d1cd5ea8fde7de6f16de73db9511549-
            xnu8796-${{ inputs.macos_version || '13.5' }}-${{ inputs.kernel_config || 'DEVELOPMENT' }}-${{ inputs.machine_config || 'LAVENDER' }}-macos15-xcode16-dxb-663906528d1cd5ea8fde7de6f16de73db9511549-
      - name: Detect runner capacity
        shell: bash
        run: |
          set -euo pipefail
          logical="$(sysctl -n hw.logicalcpu)"
          physical="$(sysctl -n hw.physicalcpu)"
          memory="$(sysctl -n hw.memsize)"
          jobs="$logical"
          echo "XNU_MAKE_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "MEMORY_SIZE_OVERRIDE=$memory" >> "$GITHUB_ENV"
          echo "PHYS_CPU_OVERRIDE=$physical" >> "$GITHUB_ENV"
          echo "LOGICAL_CPU_OVERRIDE=$logical" >> "$GITHUB_ENV"
          echo "KERNEL_PARALLELISM_OVERRIDE=$physical" >> "$GITHUB_ENV"
          printf 'Runner resources: %s physical CPUs, %s logical CPUs, %s bytes RAM; make -j%s\\n' "$physical" "$logical" "$memory" "$jobs"

      - name: Install build dependencies
        run: |
          brew install jq gum bash cmake ninja
          # darwin-xnu-build checks for xcodes; Xcode is selected explicitly above.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

      - name: Invalidate legacy cached kernel product when cache is not an exact v2 hit
        if: steps.xnu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          kernel_config="$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')"
          machine_config="$(printf '%s' "$MACHINE_CONFIG" | tr '[:upper:]' '[:lower:]')"
          if [[ "$MACHINE_CONFIG" == "LAVENDER" ]]; then
            # The Lavender machine flags now pin the compiler to generic ARMv8-A.
            # Restored v2/previous objects may contain Apple-M1-only LSE instructions,
            # so invalidate the entire XNU object tree before compiling with the new ISA.
            echo "Removing compiler-target-sensitive XNU objects and stale exported-header marker"
            rm -rf dxb/build/xnu.obj
            rm -f dxb/fakeroot/.xnu_headers_installed
          else
            cached_kernel="dxb/build/xnu.obj/kernel.${kernel_config}.${machine_config}"
            if [[ -f "$cached_kernel" ]]; then
              echo "Removing stale cached final kernel product: $cached_kernel"
              rm -f "$cached_kernel"
            else
              echo "No completed cached kernel product at $cached_kernel"
            fi
          fi

      - name: Build XNU 8796
        id: xnu-build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'true' && '-k' || '' }}
        run: set -o pipefail; bash build.sh 2>&1 | tee ../xnu-build.log

      - name: Require the expected cache-aware XNU build path
        id: xnu-rebuild
        if: success()
        env:
          EXACT_CACHE_HIT: ${{ steps.xnu-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$EXACT_CACHE_HIT" == "true" ]]; then
            kernel_config="$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')"
            machine_config="$(printf '%s' "$MACHINE_CONFIG" | tr '[:upper:]' '[:lower:]')"
            grep -Fq "XNU kernel.${kernel_config}.${machine_config} already built" xnu-build.log
            echo "Exact v2 cache hit; binary-stage verification will validate the cached kernel."
          else
            if grep -q 'already built' xnu-build.log; then
              echo "ERROR: a non-exact/legacy cache restore skipped the kernel rebuild."
              exit 1
            fi
            grep -q 'Building XNU kernel TARGET_CONFIGS=' xnu-build.log
            echo "Cache miss/prefix restore correctly entered make install."
          fi


      - name: Require Lavender XNU entry-guard patch
        if: success() && env.MACHINE_CONFIG == 'LAVENDER'
        run: |
          set -euo pipefail
          for required_patch in 0106-lavender-verbose-boot-final.patch 0107-lavender-post-assembly-entry-trace.patch 0108-lavender-post-cpubootstrap-trace.patch 0109-lavender-startup-hook-trace.patch 0110-lavender-mutex-startup-subtrace.patch 0111-lavender-armv8a-generic-cpu.patch 0112-lavender-commpage-armv8a-llsc.patch; do
            if grep -q "Skipping patch .*${required_patch}" xnu-build.log; then
              echo "Required Lavender diagnostic patch ${required_patch} was skipped; refusing this build."
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          makeinc = Path("dxb/xnu/makedefs/MakeInc.def").read_text()
          machine_line = next(line for line in makeinc.splitlines()
                              if line.startswith("MACHINE_FLAGS_ARM64_LAVENDER"))
          if "-march=armv8-a -mcpu=generic" not in machine_line:
              raise SystemExit(f"wrong Lavender compiler ISA target: {machine_line}")
          print("PASS: Lavender machine flags pin generic ARMv8-A")
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("dxb/xnu/osfmk/arm/commpage/commpage_asm.s").read_text()
          if re.search(r"\\bcasa\\b", source, re.IGNORECASE):
              raise SystemExit("unsupported LSE CASA remains in commpage assembly")
          for name, next_name in (("_pfz_trylock_and_enqueue:", "_pfz_trylock_and_dequeue:"), ("_pfz_trylock_and_dequeue:", None)):
              start = source.index(name)
              end = source.find(next_name, start + len(name)) if next_name else len(source)
              body = source[start:end]
              if "ldaxr" not in body or "stxr" not in body:
                  raise SystemExit(name + " is missing its ARMv8.0 LL/SC sequence")
          print("PASS: commpage queue locks use ARMv8.0 LDAXR/STXR; no CASA remains")
          PY
          grep -Fq -- "-march=armv8-a -mcpu=generic -arch arm64" xnu-build.log
          python3 - <<'PY'
          from pathlib import Path
          source = Path("dxb/xnu/osfmk/arm64/start.s").read_text()
          start = source.index("LEXT(start_first_cpu)")
          vbar = source.index("MSR_VBAR_EL1_X0", start)
          pre_vbar = source[start:vbar]
          # Normalize executable instructions and strip // comments before checking.
          instructions = []
          for line in pre_vbar.splitlines():
              line = line.split("//", 1)[0].strip()
              if line:
                  instructions.append(" ".join(line.split()).lower())
          unsafe_fb_base = any(line.startswith("mov64 x0, (0x9d400000") for line in instructions)
          unsafe_fb_store = any(line.startswith("str w1, [x0]") for line in instructions)
          if unsafe_fb_base and unsafe_fb_store:
              raise SystemExit("unsafe Lavender framebuffer write sequence remains before VBAR_EL1")
          if "lavender_early_mark 0x11" not in pre_vbar:
              raise SystemExit("missing RAM-only pre-VBAR checkpoint 0x11")
          print("PASS: pre-VBAR path has RAM-only markers and no framebuffer I/O")
          PY
          grep -q 'sweet_early_guard_init' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'sweet_early_map_final' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -q 'sweet_early_logo' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'sweet_early_logo();' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'lavender-fbcon' dxb/xnu/pexpert/arm/pe_serial.c
          grep -q 'lavender_no_fbcon' dxb/xnu/pexpert/arm/pe_serial.c
          grep -q 'lavender_no_fbcon=1' .github/workflows/xnu.yml
          grep -q 'if (stage < 16)' dxb/xnu/osfmk/arm64/sweet_early.c
          python3 - <<'PY'
          from pathlib import Path
          source = Path("dxb/xnu/osfmk/arm/arm_init.c").read_text()
          start_asm = Path("dxb/xnu/osfmk/arm64/start.s").read_text()
          start = source.index("void arm_init(")
          entry = source.index('sweet_early_mark(1, "arm_init entered (MMU on)")', start)
          stage4 = source.index('sweet_early_mark(4, "cpu_bootstrap done")', entry)
          stage5 = source.index('sweet_early_mark(5, "entering rtclock_early_init")', stage4)
          rtclock = source.index("rtclock_early_init();", stage5)
          stage6 = source.index('sweet_early_mark(6, "rtclock_early_init returned")', rtclock)
          stage7 = source.index('sweet_early_mark(7, "entering kernel_debug_string_early")', stage6)
          debug_string = source.index('kernel_debug_string_early("kernel_startup_bootstrap");', stage7)
          stage8 = source.index('sweet_early_mark(8, "kernel_debug_string_early returned")', debug_string)
          stage9 = source.index('sweet_early_mark(9, "entering kernel_startup_bootstrap")', stage8)
          startup = source.index("kernel_startup_bootstrap();", stage9)
          stage10 = source.index('sweet_early_mark(10, "kernel_startup_bootstrap returned")', startup)
          timer_call = source.index("timer_call_init();", stage10)
          stage11 = source.index('sweet_early_mark(11, "timer_call_init done")', timer_call)
          cpu_init = source.index("cpu_init();", stage11)
          stage12 = source.index('sweet_early_mark(12, "cpu_init done")', cpu_init)
          processor = source.index("processor_bootstrap();", stage12)
          stage13 = source.index('sweet_early_mark(13, "processor_bootstrap done")', processor)
          stage14 = source.index('sweet_early_mark(14, "entering arm_vm_init")', stage13)
          vm = source.index("arm_vm_init(xmaxmem, args);", stage14)
          stage15 = source.index('sweet_early_mark(15, "arm_vm_init returned")', vm)
          stage16 = source.index('sweet_early_mark(16, "drawing logo through permanent framebuffer alias")', stage15)
          logo = source.index("sweet_early_logo();", stage16)
          stage17 = source.index('sweet_early_mark(17, "Lavender diagnostic logo completed")', logo)
          if not (entry < stage4 < stage5 < rtclock < stage6 < stage7 < debug_string < stage8 < stage9 < startup < stage10 < timer_call < stage11 < cpu_init < stage12 < processor < stage13 < stage14 < vm < stage15 < stage16 < logo < stage17):
              raise SystemExit("Lavender post-cpu_bootstrap checkpoints or permanent VM/logo ordering is invalid")
          handoff = start_asm.index("// Set KVA of boot args as first arg")
          stage8 = start_asm.index("lavender_guard_mark 8", handoff)
          stage9 = start_asm.index("lavender_guard_mark 9", stage8)
          handoff_ret = start_asm.index("// Return to arm_init()", stage9)
          ret_insn = start_asm.index("ret", handoff_ret + len("// Return to arm_init()"))
          if not (handoff < stage8 < stage9 < ret_insn):
              raise SystemExit("post-assembly stages 8/9 must bracket the final arm_init return")
          early = Path("dxb/xnu/osfmk/arm64/sweet_early.c").read_text()
          guard_init = early.index("sweet_early_guard_init(uintptr_t boot_args_kva)")
          early_mark = early.index("sweet_early_mark(unsigned int stage", guard_init)
          early_end = early.index("void sweet_early_putc", early_mark)
          early_body = early[early_mark:early_end]
          if "*early_guard_cell = 0x100u" not in early[guard_init:early_mark]:
              raise SystemExit("C-entry guard initialization marker is missing")
          if "0x100u | stage" not in early_body or "0x80000100u | stage" not in early_body:
              raise SystemExit("C checkpoint marker namespace is missing or stage 20 is not encoded")
          c_stages = early_body.index("if (stage < 16)")
          c_console = early_body.index("lavender_console_mark(stage, label)", c_stages)
          c_publish = early_body.find("0x100u | stage", c_stages, c_console)
          if c_publish < 0:
              raise SystemExit("C checkpoint marker must be published before framebuffer text I/O")
          if "stage + 3u" in early_body:
              raise SystemExit("ambiguous legacy C checkpoint marker encoding remains")
          if "stage + 3u" in early_body:
              raise SystemExit("ambiguous legacy C checkpoint marker encoding remains")
          logo_source = Path("dxb/xnu/osfmk/arm64/sweet_early.c").read_text()
          logo_start = logo_source.index("sweet_early_logo(void)")
          logo_end = logo_source.index("sweet_early_guard_init(", logo_start)
          logo_body = logo_source[logo_start:logo_end]
          if "for (unsigned int y = 0; y < LAVENDER_FB_HEIGHT; y++)" not in logo_body:
              raise SystemExit("Lavender logo must clear the full panel, not a rectangle")
          print("PASS: deferred Apple mark follows arm_vm_init and full-panel clear")
          PY
          python3 - <<'PY'
          from pathlib import Path
          startup = Path("dxb/xnu/osfmk/kern/startup.c").read_text()
          early = Path("dxb/xnu/osfmk/arm64/sweet_early.c").read_text()
          boot = startup.index("kernel_startup_bootstrap(void)")
          enabled = startup.index("lavender_startup_trace_enabled = true", boot)
          table = startup.index("sweet_early_trace_startup(1", enabled)
          validate = startup.index("if (n == 0)", table)
          sort_begin = startup.index("sweet_early_trace_startup(2", validate)
          sort_call = startup.index("qsort(startup_entries", sort_begin)
          sort_done = startup.index("sweet_early_trace_startup(3", sort_call)
          init_begin = startup.index("sweet_early_trace_startup(4", sort_done)
          init_call = startup.index("kernel_startup_initialize_upto(STARTUP_SUB_LOCKS);", init_begin)
          init_done = startup.index("sweet_early_trace_startup(6", init_call)
          disabled = startup.index("lavender_startup_trace_enabled = false", init_done)
          if not (enabled < table < validate < sort_begin < sort_call < sort_done < init_begin < init_call < init_done < disabled):
              raise SystemExit("Lavender startup trace boundaries are out of order")
          log_function = startup.index("kernel_startup_log(startup_subsystem_id_t subsystem)")
          log_begin = startup.index("sweet_early_trace_startup(7", log_function)
          log_call = startup.index("kernel_bootstrap_log(names[subsystem]);", log_begin)
          log_done = startup.index("sweet_early_trace_startup(8", log_call)
          if not (log_function < log_begin < log_call < log_done):
              raise SystemExit("startup subsystem logging trace boundaries are invalid")
          loop = startup.index("kernel_startup_initialize_upto(startup_subsystem_id_t upto)")
          hook = startup.index("sweet_early_trace_startup(5", loop)
          callback = startup.index("cur->func(cur->arg);", hook)
          if hook >= callback:
              raise SystemExit("per-hook trace must run before invoking the startup callback")
          helper = early.index("sweet_early_trace_startup(unsigned int event")
          if "case 5:" not in early[helper:] or "case 7:" not in early[helper:]:
              raise SystemExit("startup callback/subsystem console trace cases are missing")
          trace_body = early[helper:early.index("lavender_logo_ellipse", helper)]
          if "early_guard_cell" in trace_body or "sweet_early_mark(" in trace_body:
              raise SystemExit("startup sub-trace must not modify the Guardian marker")
          print("PASS: Lavender startup trace covers table, qsort, subsystem logs and callbacks without touching Guardian state")
          PY
          grep -q 'LAVENDER_FB_ALIAS_PA_BASE 0x9c000000ULL' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'LAVENDER_FB_ALIAS_OFFSET (LAVENDER_FB_BASE - LAVENDER_FB_ALIAS_PA_BASE)' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'base + LAVENDER_FB_ALIAS_OFFSET' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'sweet_early_map_final();' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -q '0x9c000000ULL | ARM_TTE_VALID' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -q 'lavender_guard_mark 7' dxb/xnu/osfmk/arm64/start.s
          grep -q 'lavender_guard_mark 8' dxb/xnu/osfmk/arm64/start.s
          grep -q 'lavender_guard_mark 9' dxb/xnu/osfmk/arm64/start.s
          grep -q 'A53 LAST MARK=0x' shim/lavender_guardian.c
          grep -q 'delay_ms(2500U, f)' shim/lavender_guardian.c
          grep -q 'LAVENDER XNU VERBOSE BOOT' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'lavender_console_mark(stage, label)' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'lavender_console_string("LAVENDER XNU VERBOSE BOOT' dxb/xnu/osfmk/arm64/sweet_early.c
          if grep -q 'Skipping patch .*0105-lavender-verbose-boot-console.patch' xnu-build.log; then
            echo "Verbose boot console patch 0105 was skipped; refusing to package a non-verbose kernel."
            exit 1
          fi
          grep -q '#if !VMAPPLE && !defined(KERNEL_INTEGRITY_KTRR)' dxb/xnu/osfmk/arm64/start.s
          grep -q 'SPMI_OP_EXT_READL' shim/lavender_guardian.c
          grep -q 'QCOM_WDT_BASE 0x17817000' shim/lavender_guardian.c
          grep -q 'WDT0_BITE_TIME 0x14' shim/lavender_guardian.c

      - name: Upload XNU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-log
          path: xnu-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package build tree for local compilation
        if: always()
        run: |
          if [[ -d dxb/build/xnu.obj && -d dxb/xnu && -d dxb/fakeroot/usr/local/include ]]; then
            SDK=$(xcrun --sdk macosx --show-sdk-path)
            mkdir -p sdk-kernel-platform
            cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
            tar czf buildtree.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
              --exclude='kernel.development.*' --exclude='.git' \
              -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
              -C .. sdk-kernel-platform
            ls -lh buildtree.tgz
          else
            echo "No generated XNU tree exists; build failed before compilation, skipping build-tree package."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect closed KDK support libraries
        if: always()
        run: |
          mkdir -p out/kdk-libs
          : > out/kdk-libs/arch.txt
          shopt -s nullglob
          libs=(/Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a)
          for lib in "${libs[@]}"; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect kernel outputs
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          if [[ -s out/kernel.development.lavender ]]; then
            (cd out && shasum -a 256 kernel.development.lavender > SHA256SUMS)
          fi


      - name: Preserve raw kernel candidate for independent inspection
        if: always() && hashFiles('out/kernel.development.lavender') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xnu-kernel-candidate
          path: out/kernel.development.lavender
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Lavender kernel artifact
        id: xnu-kernel-verify
        if: success()
        run: |
          set -euo pipefail
          kernel=out/kernel.development.lavender
          test -s "$kernel"
          file "$kernel" | tee out/KERNEL-VERIFICATION.txt
          python3 tools/verify-lavender-kernel.py "$kernel" | tee -a out/KERNEL-VERIFICATION.txt
          # Keep the platform-tool load-command view and decoded ARM64 text for
          # independent review of the exact binary that will be packaged.
          otool -l "$kernel" > out/MACHO-LOAD-COMMANDS.txt
          otool -tvV "$kernel" > out/KERNEL-DISASSEMBLY.txt
          if [[ "$MACHINE_CONFIG" == "LAVENDER" ]]; then
            OBJDUMP="$(xcrun --find llvm-objdump)"
            "$OBJDUMP" --macho --arch=arm64 --disassemble --section=__text --mattr=+lse "$kernel" > out/KERNEL-ARM64-ISA.txt
            python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path("out/KERNEL-ARM64-ISA.txt").read_text(errors="replace").splitlines()
          start = next((i for i, line in enumerate(lines)
                        if line.strip() == "_lck_grp_reference:"), None)
          if start is None:
              raise SystemExit("could not locate linked _lck_grp_reference")
          end = next((i for i in range(start + 1, len(lines))
                      if re.match(r"^_?[A-Za-z0-9_.$]+:$", lines[i].strip())), len(lines))
          body_lines = lines[start:end]
          mnemonics = []
          for line in body_lines:
              if ":" not in line:
                  continue
              words = line.split(":", 1)[1].split()
              if len(words) >= 5 and all(len(word) == 2 and all(ch in "0123456789abcdefABCDEF" for ch in word) for word in words[:4]):
                  mnemonics.append(words[4].lower())
          forbidden = {"ldadd", "stadd", "cas", "casp", "swp", "ldclr", "ldeor", "ldset"}
          if forbidden.intersection(mnemonics):
              raise SystemExit("LSE atomic instruction remains in _lck_grp_reference: " + repr(sorted(forbidden.intersection(mnemonics))))
          if "ldxr" not in mnemonics or "stxr" not in mnemonics:
              raise SystemExit("expected ARMv8-A LDXR/STXR exclusive atomic sequence is missing: " + repr(mnemonics))
          print("PASS: linked _lck_grp_reference uses ARMv8-A LDXR/STXR, not LSE")
          PY
          fi
          shasum -a 256 "$kernel" | tee out/SHA256SUMS

      - name: Save XNU build cache after successful compilation
        if: always() && steps.xnu-build.outcome == 'success' && steps.xnu-rebuild.outcome == 'success' && steps.xnu-kernel-verify.outcome == 'success' && steps.xnu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dxb/build
            dxb/fakeroot
          key: xnu8796-v4-armv8a-${{ inputs.macos_version || '13.5' }}-${{ inputs.kernel_config || 'DEVELOPMENT' }}-${{ inputs.machine_config || 'LAVENDER' }}-macos15-xcode16-dxb-663906528d1cd5ea8fde7de6f16de73db9511549-${{ hashFiles('xnu/patches/*.patch', 'xnu/patches/*.sh', 'tools/fix-lavender-pre-vbar.py') }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: error

  package:
    name: Package RAM-only Lavender fastboot image
    needs: build
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.machine_config == 'LAVENDER') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out matching source
        uses: actions/checkout@v4

      - name: Download XNU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify Lavender Mach-O kernel exists
        run: |
          set -euo pipefail
          find out -maxdepth 2 -type f -printf '%p %s bytes\n'
          python3 - <<'PY'
          import os, struct
          from pathlib import Path
          candidates = sorted(
              (p for p in Path("out").rglob("kernel.development*") if p.is_file() and p.stat().st_size > 100_000),
              key=lambda p: (p.name != "kernel.development.lavender", str(p))
          )
          selected = None
          for candidate in candidates:
              header = candidate.read_bytes()[:8]
              if len(header) >= 8:
                  magic, cputype = struct.unpack("<II", header)
                  if magic == 0xfeedfacf and cputype == 0x0100000c:
                      selected = candidate.resolve()
                      break
          if selected is None:
              raise SystemExit("No 64-bit ARM Mach-O kernel found in xnu-kernel artifact")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"KERNEL_PATH={selected}\n")
          print(f"Selected ARM64 Mach-O kernel: {selected} ({selected.stat().st_size} bytes)")
          PY

      - name: Install AArch64 and Android image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install AOSP mkbootimg with GKI support
        run: |
          set -euo pipefail
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/aosp-mkbootimg"
          test -s "$RUNNER_TEMP/aosp-mkbootimg/mkbootimg.py"
          cat > "$RUNNER_TEMP/mkbootimg" <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$AOSP_MKBOOTIMG_DIR/mkbootimg.py" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/mkbootimg"
          echo "AOSP_MKBOOTIMG_DIR=$RUNNER_TEMP/aosp-mkbootimg" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Download and verify published Lavender OTA
        env:
          OTA_URL: https://github.com/NAANG360/Lucid-OS/releases/download/lucid-android15-lavender-build-4/LucidOS-Android15-lavender-build-4-experimental.zip
          OTA_SHA256: d2b81388a57c685b82e3cb8f29da475f540dfcb9f5114003846d9337533d3219
        run: |
          set -euo pipefail
          mkdir -p stock
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 "$OTA_URL" -o stock/lucid-build4.zip
          echo "$OTA_SHA256  stock/lucid-build4.zip" | sha256sum -c -

      - name: Extract the exact stock boot image and DTB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("stock/lucid-build4.zip")
          with zipfile.ZipFile(archive) as z:
              candidates = [n for n in z.namelist() if PurePosixPath(n).name == "boot.img"]
              if len(candidates) != 1:
                  raise SystemExit(f"expected exactly one boot.img in OTA, found: {candidates}")
              member = candidates[0]
              z.extract(member, "stock/extracted")
              extracted = Path("stock/extracted") / member
              shutil.copyfile(extracted, "stock/boot.img")
              print(f"Extracted {member}: {Path('stock/boot.img').stat().st_size} bytes")
          PY
          python3 tools/unpack_bootv2.py stock/boot.img stock/unpacked
          python3 tools/extract_appended_fdt.py stock/unpacked/kernel --index 0 --compatible qcom,sdm660 --model-contains 'SDM 660' --output stock/unpacked/dtb
          test -s stock/unpacked/dtb
          python3 - <<'PY'
          import os, re, sys
          text = open("stock/unpacked/header.txt", encoding="utf-8").read()
          match = re.search(r"os_version: 0x([0-9a-fA-F]+)", text)
          value = int(match.group(1), 16) if match else 0
          major = (value >> 25) & 0x7f
          minor = (value >> 18) & 0x7f
          patch = (value >> 11) & 0x7f
          year = 2000 + ((value >> 4) & 0x7f)
          month = value & 0xf
          if 1 <= month <= 12:
              os_version = f"{major}.{minor}.{patch}"
              patch_level = f"{year}-{month:02d}"
          else:
              os_version, patch_level = "15.0.0", "2025-03"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"OS_VERSION={os_version}\n")
              env.write(f"OS_PATCH_LEVEL={patch_level}\n")
          print(f"Stock boot metadata: Android {os_version}, security patch {patch_level}", file=sys.stderr)
          PY

      - name: Generate and validate Lavender Apple Device Tree
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # XNU will enter on Kryo 260 Gold core MPIDR 0x100; keep the ADT boot CPU aligned.
          python3 tools/mkadt-lavender.py artifacts/lavender.adt --boot-mpidr 0x100 --check

      - name: Build the Lavender XNU payload
        run: |
          set -euo pipefail
          file "$KERNEL_PATH"
          python3 tools/mkpayload.py "$KERNEL_PATH" artifacts/lavender.adt artifacts/lavender-payload.bin \
            --machine LAVENDER \
            --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 lavender_no_fbcon=1'

      - name: Build non-flashing fastboot boot image
        env:
          TARGET: lavender
          DTB_PATH: ${{ github.workspace }}/stock/unpacked/dtb
        run: |
          set -euo pipefail
          bash shim/build.sh "$GITHUB_WORKSPACE/artifacts/lavender-payload.bin"
          test -s shim/out/shim-boot.img
          cp shim/out/shim-boot.img iosboot.img

      - name: Verify boot image structure and payload identity
        run: |
          set -euo pipefail
          python3 tools/unpack_bootv2.py shim/out/shim-boot.img artifacts/verify
          python3 - <<'PY'
          from pathlib import Path
          kernel = Path("artifacts/verify/kernel").read_bytes()
          payload = Path("artifacts/verify/ramdisk").read_bytes()
          dtb = Path("artifacts/verify/dtb").read_bytes()
          import re
          header = {}
          for line in Path("artifacts/verify/header.txt").read_text().splitlines():
              if ": " in line:
                  k, v = line.split(": ", 1)
                  header[k] = v
          assert kernel[0x38:0x3c] == b"ARMd", "shim is missing the ARM64 Image header"
          assert payload[:8] == b"LAVENDRX", "ramdisk does not contain a Lavender XNU payload"
          assert len(dtb) > 0, "stock DTB is missing"
          def hx(k): return int(header[k], 0)
          ranges = {
              "kernel": (hx("kernel_addr"), hx("kernel_addr") + len(kernel)),
              "ramdisk": (hx("ramdisk_addr"), hx("ramdisk_addr") + len(payload)),
              "dtb": (hx("dtb_addr"), hx("dtb_addr") + len(dtb)),
          }
          for name, (lo, hi) in ranges.items():
              assert lo >= 0 and hi > lo, f"invalid {name} load range: {lo:#x}..{hi:#x}"
          names = list(ranges)
          for i, a in enumerate(names):
              for b in names[i+1:]:
                  alo, ahi = ranges[a]; blo, bhi = ranges[b]
                  assert ahi <= blo or bhi <= alo, (
                      f"BOOT IMAGE LOAD OVERLAP: {a} [{alo:#x},{ahi:#x}) "
                      f"and {b} [{blo:#x},{bhi:#x})"
                  )
          assert hx("dtb_addr") % 0x1000 == 0, "DTB load address is not page-aligned"
          print("PASS: non-overlapping boot load ranges:")
          for name, (lo, hi) in ranges.items():
              print(f"  {name}: [{lo:#x}, {hi:#x}) ({hi-lo} bytes)")
          print(f"PASS: ARM64 shim={len(kernel)} bytes, LAVENDRX payload={len(payload)} bytes, DTB={len(dtb)} bytes")
          PY
          sha256sum "$KERNEL_PATH" shim/out/shim-boot.img artifacts/lavender-payload.bin artifacts/lavender.adt > artifacts/SHA256SUMS
          {
            echo "XNU workflow run: ${{ github.run_id }}"
            echo "Source commit: ${{ github.sha }}"
            echo "Boot mode: fastboot boot only; do not flash to a partition"
            echo "Volume-key chord: hold Volume Up + Volume Down for 3 seconds; this requests a reset only and does not select a recovery boot target (physical validation pending)"
            echo "Reset path: arm SDM660 one-tick watchdog at 0x17817000 before calling PSCI SYSTEM_RESET"
            echo "Reset caveat: watchdog register sequence is source-grounded; this watchdog-first ordering still needs physical validation"
            echo "XNU logo: full-panel clear and Apple mark are deferred until arm_vm_init returns and the permanent framebuffer alias is installed; no claim of full iOS boot"
            echo "XNU entry diagnostics: assembly stages 3-7 are green tiles; stages 8-9 trace boot-args KVA setup and the instruction immediately before ret to arm_init"
            echo "XNU C diagnostics: stage 4 is cpu_bootstrap; stages 5-14 split rtclock, early startup hooks, timer, cpu_init, processor_bootstrap and arm_vm_init entry; guardian words use 0x100+stage"
            echo "Framebuffer console: lavender_no_fbcon=1 disables only the legacy pexpert serial fbcon; the direct early checkpoint text renderer remains active"
            echo "A53 stall report: last shared marker is printed at y=580 for 2.5 seconds before the watchdog reset"
            echo "Early watchdog: reset if XNU stage marker stalls for 60 seconds before stage 20"
            echo "Target: Redmi Note 7 / lavender / Qualcomm SDM660"
            echo "XNU boot CPU MPIDR: 0x100 (Kryo 260 Gold cluster)"
            echo "Android boot metadata: ${OS_VERSION} / ${OS_PATCH_LEVEL}"
            echo "Kernel: ${KERNEL_PATH}"
          } > artifacts/BUILD-MANIFEST.txt

      - name: Upload Lavender fastboot test image
        uses: actions/upload-artifact@v4
        with:
          name: lavender-fastboot-boot-test
          path: |
            shim/out/shim-boot.img
            iosboot.img
            artifacts/lavender-payload.bin
            artifacts/lavender.adt
            artifacts/SHA256SUMS
            artifacts/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
