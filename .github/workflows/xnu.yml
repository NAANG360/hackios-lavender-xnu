name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (LAVENDER for this repository; WHYRED kept for the shared packer)
        default: LAVENDER
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      build_mode:
        description: both / normal (no log capture) / log (ring + page dumps)
        type: choice
        options:
          - both
          - normal
          - log
        default: both
      panel_console:
        description: text (console drawn over the GUI) / hidden (sweetfb_noconsole=1)
        type: choice
        options:
          - text
          - hidden
        default: text
      fb_test_pattern:
        description: on (four colour bars prove the panel scans out) / off (clean panel)
        type: choice
        options:
          - "off"
          - "on"
        default: "off"
      kernel_source_run_id:
        description: "Optional package-only mode: reuse xnu-kernel from a successful earlier workflow run"
        required: false
        default: ""
      build_userdata_image:
        description: "Build iOS 16.7.16 HFSX sparse image for the userdata partition"
        type: boolean
        required: false
        default: true
      userdata_size_mib:
        description: "Logical HFSX size in MiB (22208 MiB = 21.69 GiB fits 32 GB lavender userdata with 64 MiB headroom)"
        required: false
        default: "22208"
      rootfs_source_run_id:
        description: "Reuse lavender-ios-rootfs artifact from a previous successful workflow run"
        required: false
        default: ""
  push:
    branches: [main, integration/lavender-ios16-base]
    paths:
      - "xnu/patches/**"
      - "resources/**"
      - ".github/workflows/xnu.yml"
      # the host tests and patch checks gate the build: a change there must run
      - "tests/**"
      - "drivers/**"
      - "shim/**"
      - "tools/**"


concurrency:
  # Root filesystem and kernel jobs can be reused across separate dispatches.
  # Keep each run independent so a fresh kernel compile does not cancel an
  # already-running 16 GiB userdata image build on the same branch.
  group: xnu-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  # lavender-ios16: every push builds the Redmi Note 7 kernel.
  MACHINE_CONFIG: ${{ inputs.machine_config || 'LAVENDER' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

permissions:
  actions: read
  contents: read

jobs:
  # lavender-ios16: the USB/keys drivers (0200/0201) on simulated registers.
  # Linux only: the mocks stand in for XNU headers and are built against
  # glibc, not the macOS SDK. Cheap, so it gates the macOS build.
  host-tests:
    name: host tests (USB/keys)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: USB/keys drivers on simulated registers
        run: |
          set -o pipefail
          clang --version | head -1
          bash tests/host/prepare-tree.sh "$RUNNER_TEMP/lavender-tree"
          OUT_DIR="$RUNNER_TEMP/host-out" bash tests/host/run.sh "$RUNNER_TEMP/lavender-tree"
      - name: Lavender native QUP/RPM protocol and ADT tests
        run: bash tests/native-lavender/run.sh

  build:
    if: ${{ inputs.kernel_source_run_id == '' }}
    needs: host-tests
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host tests and patch validation
        run: |
          # Unified-diff structure of every patch (a corrupt hunk made CI drop
          # 0143/0144) plus the three phase 4 host tests: SDHCI mock, hardened
          # GPT with the SYSTEM log fence, and the console log ring.
          #
          # Republish the tail as ::error:: annotations: job logs need a
          # token, but the annotations of a failed check are public, so a
          # macOS-only failure can still be read back without one.
          set -o pipefail
          if ! bash tests/run_tests.sh 2>&1 | tee /tmp/host-tests.log; then
            tail -25 /tmp/host-tests.log | while IFS= read -r line; do
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
            exit 1
          fi

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          mkdir -p dxb/patches/support
          cp xnu/patches/support/LavenderQUPI2C.cpp xnu/patches/support/LavenderQUPI2C.h \
             xnu/patches/support/LavenderRPMGLINK.cpp xnu/patches/support/LavenderRPMGLINK.h \
             dxb/patches/support/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxb/build.sh")
          s = p.read_text()
          nl = chr(10)
          needle = nl.join([
              '        cd "${WORK_DIR}"',
              '    fi',
              '}',
              '',
              'build_bootstrap_cmds()'
          ])
          insert = nl.join([
              '        if [ -f "${PATCH_DIR}/0600-lavender-native-i2c.sh" ]; then',
              '            running "Running post-patch script: ${PATCH_DIR}/0600-lavender-native-i2c.sh"',
              '            KDKROOT="${KDKROOT}" bash "${PATCH_DIR}/0600-lavender-native-i2c.sh"',
              '        fi'
          ]) + nl
          if needle not in s:
              raise SystemExit("dxb post-patch insertion anchor changed")
          s = s.replace(needle, insert + needle, 1)
          p.write_text(s)
          print("Installed deterministic post-patch hook for Lavender native IOKit staging")
          PY
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          ccache -z
          bash build.sh 2>&1 | tee ../build.log
          ccache -s

      - name: Verify Lavender native IOKit drivers were staged
        if: success()
        run: |
          set -euo pipefail
          XNU_DIR="$(find dxb -path '*/iokit/conf/files.arm64' -print -quit | sed 's|/iokit/conf/files.arm64$||')"
          test -n "$XNU_DIR" || { echo "::error::XNU source tree not found after patching"; exit 1; }
          python3 tools/verify-lavender-native-i2c.py --xnu-root "$XNU_DIR"

      - name: Republish build errors
        if: failure()
        run: |
          # Job logs need a token; the annotations of a failed check are
          # public. The dxb build warns about its own patches (TrustCache,
          # skywalk_sonoma, ...) on every run; those are not this build's
          # errors. Keep only real compiler/linker errors.
          if [ ! -f build.log ]; then
            echo "::error::no build.log (build never started)"
            exit 0
          fi
          grep -nE 'error:|fatal error:|ld: |Undefined symbols|undefined symbol' build.log \
            | grep -vE 'Skipping patch|patch does not apply|already exists in working directory|patch failed|dxb/patches' \
            | tail -9 | cut -c1-400 > /tmp/build-errors.txt || true
          while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done < /tmp/build-errors.txt

      - name: Republish build log tail
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            exit 0
          fi
          tail -8 build.log | cut -c1-400 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done

      - name: Fail if a storage or board patch was skipped
        if: always()
        run: |
          # dxb applies patches with `git apply --check` and only warns on
          # failure, so a malformed hunk silently ships a kernel without that
          # feature. Make it fatal.
          if [ ! -f build.log ]; then
            echo "no build.log (build never started)"; exit 0
          fi
          if grep -E 'Skipping patch .*(014[2345689]|015[0-9]|016[0-9]|017[0-9]|018[0-9]|019[0-9]|02[0-9][0-9]|07[0-9][0-9])-' build.log; then
            echo "::error::a critical patch was skipped by the build"
            exit 1
          fi
          echo "no critical patch skipped"

      - name: Package build tree for local compiles
        if: always()
        run: |
          if [ ! -d dxb/xnu ] || [ ! -d dxb/build/xnu.obj ]; then
            echo "no kernel build tree was created"
            exit 0
          fi
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          shopt -s nullglob
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: success()
        run: |
          set -euo pipefail
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/
          ls -la out
          KERNEL_BIN="$(find out -maxdepth 1 -type f -name 'kernel.*' ! -name '*.dSYM' ! -name '*.unstripped' | head -1)"
          test -n "$KERNEL_BIN"
          file "$KERNEL_BIN" | grep -q 'Mach-O 64-bit.*arm64'
          (cd out && shasum -a 256 "$(basename "$KERNEL_BIN")" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: error

  # Lavender is not allowed to fall through to the legacy Whyred recovery packer.
  # It gets its own Android boot-image artifacts for the user's custom ROM installer.
  lavender-boot-image:
    name: Lavender iOS boot image
    needs: [host-tests, build]
    if: ${{ always() && (inputs.machine_config || 'LAVENDER') == 'LAVENDER' && needs.host-tests.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.kernel_source_run_id != '')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: xnu/out
          repository: ${{ github.repository }}
          run-id: ${{ inputs.kernel_source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Lavender shim toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq clang lld llvm python3 cpio
          clang --version | head -1
          ld.lld --version | head -1
          llvm-objcopy --version | head -1
          llvm-readelf --version | head -1
          llvm-nm --version | head -1

      - name: Build ROM-installer boot images
        run: |
          set -euo pipefail
          KERNEL=xnu/out/kernel.development.lavender
          test -s "$KERNEL" || { echo "::error::missing Lavender XNU kernel"; ls -lR xnu/out; exit 1; }
          test -s resources/lavender_dtb.bin || { echo "::error::missing Lavender ABL DTB"; exit 1; }
          (cd xnu/out && sha256sum -c SHA256SUMS)
          python3 tools/check_payload.py --board lavender --kernel "$KERNEL"
          python3 tools/check_payload.py --board lavender --dtb resources/lavender_dtb.bin

          # Normal ABL boot path: this image is intended for the boot partition
          # via the user's existing ROM installer. No recovery partition is used.
          # The iOS HFSX root is still expected at emmcroot0; this artifact does
          # not contain or flash a root filesystem.
          COMMON="emmcrw=1 rootrw=1 cs_enforcement_disable=1 unentitled_ios_sim_launch=1 launchd_unsecure_cache=1 wdt=-1 wdt_test=no_user_checkin cpus=4 lavenderrpm=1 lavenderqup=0 sweetouchi2c=1 sweetouchwait=0"
          FB_TEST="${{ inputs.fb_test_pattern || 'off' }}"
          FB_ARG=""
          FB_VERIFY="--reject sweetfbtest=1"
          if [ "$FB_TEST" = "on" ]; then
            FB_ARG="sweetfbtest=1"
            FB_VERIFY="--require sweetfbtest=1"
          fi
          COMMON="$COMMON $FB_ARG sweetrtc=$(date +%s)"

          PANEL="${{ inputs.panel_console || 'text' }}"
          NOCONSOLE=0
          if [ "$PANEL" = "hidden" ]; then NOCONSOLE=1; else COMMON="$COMMON sweetfb_noconsole=2"; fi

          mkdir -p dist
          build_image() { # output_name diagnostic_args kprintf_spam mute
            local output_name="$1" diagnostic_args="$2" spam="$3" mute="$4"
            rm -rf shim/out
            BOARD=lavender ROOTDEV=emmcroot0 NO_DUMMY_RAMDISK=1 \
              EXTRA_CMDLINE="$COMMON $diagnostic_args" \
              KPRINTF_SPAM="$spam" KPRINTF_MUTE="$mute" \
              PANEL_NOCONSOLE="$NOCONSOLE" \
              CC=clang LD=ld.lld OBJCOPY=llvm-objcopy \
              READELF=llvm-readelf NM=llvm-nm HOST_CC=clang \
              bash shim/build.sh "$KERNEL"

            local size
            size=$(stat -c%s shim/out/shim-boot.img)
            echo "$output_name = $size bytes (Lavender ABL limit 7340032)"
            test "$size" -le 7340032 || { echo "::error::Lavender boot image exceeds ABL limit"; exit 1; }
            cp shim/out/shim-boot.img "dist/$output_name"

            python3 tools/payload_cmdline.py --image "dist/$output_name" \
              --require rd=emmcroot0 --require emmcrw=1 --require rootrw=1 \
              --require cs_enforcement_disable=1 \
              --require unentitled_ios_sim_launch=1 \
              --require launchd_unsecure_cache=1 --require cpus=4 --require lavenderrpm=1 --require lavenderqup=0 --require sweetouchi2c=1 $FB_VERIFY
            python3 tools/payload_cmdline.py --image "dist/$output_name" --reject 'ignition_level='
            if [ "$NOCONSOLE" = 1 ]; then
              python3 tools/payload_cmdline.py --image "dist/$output_name" --require sweetfb_noconsole=1
            else
              python3 tools/payload_cmdline.py --image "dist/$output_name" --reject sweetfb_noconsole=1
            fi
          }

          # Preferred image: visible verbose boot text over the existing Apple
          # boot mark, with the persistent log ring and detailed CS diagnostics.
          build_image iosboot.img "sweetlog=1 cs_debug=2" "-enable_kprintf_spam" 0
          # Smaller/less noisy fallback for repeated boots.
          build_image iosboot-quiet.img "" "" 1

          python3 - <<'PY'
          import hashlib, json, os
          names = ["iosboot.img", "iosboot-quiet.img"]
          images = {}
          for name in names:
              path = os.path.join("dist", name)
              if os.path.isfile(path):
                  data = open(path, "rb").read()
                  images[name] = {"size": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          manifest = {
              "schema": 1,
              "device": "Xiaomi Redmi Note 7 / 7S",
              "codename": "lavender",
              "board": "Qualcomm SDM660",
              "image_format": "Android boot image header v0, Qualcomm ABL",
              "preferred_image": "iosboot.img",
              "partition_target": "boot",
              "recovery_partition_required": False,
              "root_device": "emmcroot0",
              "root_filesystem": "Pre-staged iOS HFSX root expected; not included in this artifact",
              "vbmeta_or_dtbo_modified": False,
              "bootloader_requirement": "Unlocked Xiaomi ABL",
              "boot_trust_status": "Build-time format and DTB checks passed; physical ABL acceptance remains to be verified on-device",
              "images": images
          }
          with open("dist/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          (cd dist && sha256sum iosboot*.img > SHA256SUMS)

          cat > dist/INSTALLER-INTEGRATION.md <<'EOF'
          LIOS LIOS iOS boot payload
          ====================================

          Preferred: iosboot.img
          - Verbose kernel console remains visible over the Apple boot mark.
          - Includes the persistent console ring and detailed code-signing diagnostics.
          - Intended for the normal Xiaomi ABL boot path via the boot partition.

          Alternative: iosboot-quiet.img
          - Same XNU/ADT/board image path with reduced diagnostic output.

          Integration
          -----------
          Place iosboot.img in the existing custom ROM installer and make its final
          boot-image operation write this file to the device's boot partition.
          Do not route it through recovery, and do not overwrite vbmeta, dtbo,
          modem, persist, or the user's other partitions as part of this handoff.
          Keep a copy of the ROM's original boot image so Android can be restored.

          Important
          ---------
          Both images pass host-side kernel/DTB/payload checks and the Lavender
          image-size limit. This does not prove that this handset's ABL/verified-
          boot policy accepts the image. The bootloader must be unlocked and
          physical boot acceptance must be verified before treating the image
          as trusted. This job does not modify or disable vbmeta/AVB.

          The payload uses rd=emmcroot0. A compatible iOS HFSX root must already
          be present at that root device. The filesystem image is not included
          and this boot artifact does not repartition or flash userdata.
          EOF

          echo "### Lavender ROM-installer payload" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Size | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/iosboot*.img; do
            echo "| $(basename "$f") | $(stat -c%s "$f") B | $(sha256sum "$f" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lavender-iosboot-payload
          path: dist/
          if-no-files-found: error


  lavender-root-filesystem:
    name: Build iOS HFSX userdata image
    needs: host-tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_userdata_image == true && inputs.rootfs_source_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux filesystem and sparse-image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq cmake g++ git pkg-config libfuse3-dev libbz2-dev zlib1g-dev hfsprogs android-sdk-libsparse-utils fuse3 rsync python3 zstd
          sudo modprobe fuse
          sudo modprobe hfsplus
          command -v mkfs.hfsplus
          command -v fsck.hfsplus
          command -v img2simg
          command -v simg_dump

      - name: Install pinned ipsw firmware extractor
        run: |
          set -euo pipefail
          VERSION=3.1.750
          ARCHIVE="$RUNNER_TEMP/ipsw_${VERSION}_linux_x86_64.tar.gz"
          curl -fL --retry 4 --retry-all-errors "https://github.com/blacktop/ipsw/releases/download/v${VERSION}/ipsw_${VERSION}_linux_x86_64.tar.gz" -o "$ARCHIVE"
          echo "d12c301625ca938f5cd5ba79a410359d0fa9f4076fec9dd529a15510bd2ca63e  $ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ipsw-bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/ipsw-bin"
          IPSW_BIN="$(find "$RUNNER_TEMP/ipsw-bin" -type f -name ipsw -print -quit)"
          test -n "$IPSW_BIN" || { echo "::error::ipsw binary missing from pinned release"; find "$RUNNER_TEMP/ipsw-bin" -maxdepth 3 -type f; exit 1; }
          sudo install -m 0755 "$IPSW_BIN" /usr/local/bin/ipsw
          ipsw version

      - name: Build APFS FUSE reader
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse.git "$RUNNER_TEMP/apfs-fuse"
          cmake -S "$RUNNER_TEMP/apfs-fuse" -B "$RUNNER_TEMP/apfs-fuse/build" -DUSE_FUSE3=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/apfs-fuse/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/apfs-fuse/build" --prefix /usr/local
          command -v apfs-fuse

      - name: Download and verify iPhone X 16.7.16 IPSW
        run: |
          set -euo pipefail
          IPSW="$RUNNER_TEMP/iPhone10,3_16.7.16_20H392_Restore.ipsw"
          URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$URL" -o "$IPSW"
          echo "ece1194f7e233e9109c5790a8d23a4564a10a254e15ec5b09978a343265568fb  $IPSW" | sha256sum -c -
          echo "IPSW_PATH=$IPSW" >> "$GITHUB_ENV"

      - name: Build and validate HFSX userdata image
        run: |
          set -euo pipefail
          bash tools/build-ios-root-linux.sh "$IPSW_PATH" "$RUNNER_TEMP/ios-root" "${{ inputs.userdata_size_mib || '22208' }}"
          test -s "$RUNNER_TEMP/ios-root/ios16-root.simg.zst"
          test -s "$RUNNER_TEMP/ios-root/root-manifest.json"
          cat "$RUNNER_TEMP/ios-root/root-manifest.json"
          ls -lh "$RUNNER_TEMP/ios-root/ios16-root.simg.zst"
          df -h "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: lavender-ios-rootfs
          path: |
            ${{ runner.temp }}/ios-root/ios16-root.simg.zst
            ${{ runner.temp }}/ios-root/root-manifest.json
            ${{ runner.temp }}/ios-root/ROOT-SHA256SUMS
            ${{ runner.temp }}/ios-root/ios16-root.sparse.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  lavender-ios-install-payload:
    name: Assemble complete Lavender iOS install payload
    needs: [lavender-boot-image, lavender-root-filesystem]
    if: ${{ always() && needs.lavender-boot-image.result == 'success' && (needs.lavender-root-filesystem.result == 'success' || inputs.rootfs_source_run_id != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lavender-iosboot-payload
          path: dist

      - name: Wait for source userdata artifact
        if: ${{ inputs.rootfs_source_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOTFS_SOURCE_RUN_ID: ${{ inputs.rootfs_source_run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROOTFS_SOURCE_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="lavender-ios-rootfs" and .expired==false) | .id' | grep -q .; then
              echo "Source userdata artifact is available"
              exit 0
            fi
            echo "Waiting for source userdata artifact ($attempt/30)"
            sleep 60
          done
          echo "::error::Source userdata artifact did not become available"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: lavender-ios-rootfs
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rootfs_source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble installer payload and manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s dist/iosboot.img
          test -s dist/iosboot-quiet.img
          test -s dist/ios16-root.simg.zst
          test -s dist/root-manifest.json
          (
            cd dist
            sha256sum iosboot.img iosboot-quiet.img ios16-root.simg.zst > SHA256SUMS
          )
          python3 - <<'PY'
          import hashlib, json, os
          names = ["iosboot.img", "iosboot-quiet.img", "ios16-root.simg.zst"]
          images = {}
          for name in names:
              path = os.path.join("dist", name)
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              images[name] = {"size": os.path.getsize(path), "sha256": digest.hexdigest()}
          manifest = {
              "schema": 1,
              "device": "Xiaomi Redmi Note 7 / 7S",
              "codename": "lavender",
              "board": "Qualcomm SDM660",
              "os": "iOS 16.7.16 (20H392)",
              "kernel": "XNU DEVELOPMENT / Lavender, native LIOS RPM-GLINK + QUP-v2 providers",
              "boot_image": "iosboot.img",
              "boot_partition": "boot",
              "userdata_image": "ios16-root.simg",
              "userdata_partition": "userdata",
              "userdata_filesystem": "16 GiB journaled case-sensitive HFSX",
              "xnu_root_device": "emmcroot0",
              "recovery_partition_required": False,
              "vbmeta_or_dtbo_modified": False,
              "bootloader_requirement": "Unlocked Xiaomi ABL",
              "physical_boot_trust": "Not yet verified on the handset",
              "images": images
          }
          with open("dist/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat > dist/INSTALLER-INTEGRATION.md <<'EOF'
          LIOS Lavender — complete iOS 16.7.16 install payload
          =====================================================

          Images
          ------
          - ios16-root.simg: 16 GiB logical HFSX root in Android sparse-image v1 format.
            Target partition: userdata. The XNU root-device name for this eMMC partition
            is emmcroot0.
          - iosboot.img: preferred verbose XNU boot image. The Apple boot mark remains
            visible behind kernel console text, with the persistent log ring enabled.
            Target partition: boot.
          - iosboot-quiet.img: reduced-console fallback for the same kernel and ADT.

          Installer order
          ---------------
          1. Flash ios16-root.simg to userdata using a sparse-aware installer/fastboot
             path. The userdata partition must be at least 16 GiB.
          2. Flash iosboot.img to the normal boot partition.
          3. Leave recovery, vbmeta, dtbo, modem, persist and unrelated partitions alone.

          This replaces Android's userdata contents with the iOS HFSX root. Back up
          anything in userdata first. Keep the previous ROM boot image for rollback.
          No recovery partition is needed, and this package does not rewrite AVB/vbmeta.

          The boot image contains the native Lavender RPM/GLINK provider. The QUP-v2
          provider is compiled and registered but opt-in (lavenderqup=0) so it does not
          seize GPIO2/3 while the reference bit-banged touchscreen driver still owns
          those pins. RPM is enabled (lavenderrpm=1). This preserves the known-working
          touch path while carrying the LIOS native platform work into the base.

          Build-time kernel, DTB, sparse-image, HFSX and payload checks passed. Actual
          ABL trust and the first physical boot remain device-side acceptance tests.
          EOF
          echo "### Complete Lavender iOS install payload" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | --- |" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/iosboot*.img dist/ios16-root.simg.zst; do
            echo "| $(basename "$f") | $(stat -c%s "$f") B | $(sha256sum "$f" | cut -d' ' -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lavender-ios16-install-payload
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Second zip of a completed build: the flashable boot image. The kernel
  # artifact cannot be downloaded without a token, and packing the shim by hand
  # needs a Linux toolchain, so every build publishes the ready-to-flash
  # shim-boot.img next to the kernel.
  package:
    name: boot image
    needs: build
    # This legacy shim packer uses Whyred's panel, DTB and image policy.
    # Lavender's UniXNU payload/firmware are assembled by the consuming port.
    if: ${{ (inputs.machine_config || 'LAVENDER') == 'WHYRED' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: xnu/out

      - name: Install packaging toolchain
        # A slow apt mirror once left this step running for 16 minutes. Keep
        # the exact package set of the last green build (trimming it to
        # binutils-only made the packaging step fail with exit 127), add apt
        # retries, and cap the step so a bad mirror fails fast.
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq clang lld gcc-aarch64-linux-gnu zopfli
          clang --version | head -1
          ld.lld --version | head -1
          aarch64-linux-gnu-objcopy --version | head -1
          zopfli --version

      - name: Build the boot image
        env:
          BOARD: whyred
          CC: clang
          LD: ld.lld
          OBJCOPY: aarch64-linux-gnu-objcopy
          READELF: aarch64-linux-gnu-readelf
          NM: aarch64-linux-gnu-nm
          HOST_CC: clang
          NO_DUMMY_RAMDISK: "1"
          # Root from the HFS+ (HFSX) volume staged in userdata, with writes
          # enabled so HFS+ can replay its journal and mount read-write.
          ROOTDEV: emmcroot0
          # The two command lines live in the run block: this job publishes a
          # fast image and a diagnostic one from the same kernel.
        run: |
          set -euo pipefail
          KERNEL=xnu/out/kernel.development.whyred
          test -f "$KERNEL" || { echo "::error::no whyred kernel in the artifact"; ls -lR xnu/out; exit 1; }
          test -f resources/whyred_dtb.bin || { echo "::error::resources/whyred_dtb.bin missing"; exit 1; }
          (cd xnu/out && sha256sum -c SHA256SUMS)

          # Common switches. cs_enforcement_disable=1 is XNU's own switch
          # (kern_cs.c cs_init) that stops the kernel from killing tasks for an
          # unsealed root; debug= is already in the command line, so
          # PE_i_can_has_debugger() is true.
          #
          # unentitled_ios_sim_launch=1 is required because this is an
          # XNU_TARGET_OS_OSX kernel running an iOS userland: process_signature()
          # refuses PLATFORM_IOS binaries unless the spawn carries the platform
          # or this DEVELOPMENT tunable is set (EXEC_EXIT_REASON_WRONG_PLATFORM,
          # namespace 9 code 0xe - the exact reason launchd died with).
          # launchd_cache_loader looks for the AMFI IOKit service and aborts
          # ("Unable to find AMFI", OS_REASON namespace 7 subcode 1) because
          # this kernel only implements the AMFI MAC policy, not the service.
          # The iOS 16 binary has launchd_unsecure_cache= for exactly this
          # bring-up case: it skips the signature push and the AMFI lookup.
          #
          # Normal mode is quiet on purpose: no console ring, no cs_debug
          # page dumps, no kprintf spam. Log mode adds all three.
          # sweetlog=1 keeps the 4 MiB console ring on SYSTEM: the serial
          # scrollback only reaches the tail (launchd respawn loop), and the
          # backboardd/SpringBoard lines are at the start. Pull it from
          # recovery with tools/sweet-log-pull.sh.
          #
          # sweetfbtest=1 draws four colour bars into the boot framebuffer
          # once, early in BSD init. They were the only proof that MDSS still
          # scans the ABL splash out; now that the lock screen is on the panel
          # they are just visual noise, so the workflow default is off.
          # Set fb_test_pattern=on to bring the scanout probe back.
          #
          # The normal image also carries the display profile of the lavender
          # image that reached the lockscreen: sweetfb_stayon=1 and
          # sweetfb_hz=60 (both parsed by this kernel). disable_kprintf_output
          # comes from that same command line; it is inert here - this kernel
          # has no boot-arg of that name - and is kept only so the line
          # matches the one known to boot.
          COMMON="emmcrw=1 cs_enforcement_disable=1 unentitled_ios_sim_launch=1"
          FB_TEST="${{ inputs.fb_test_pattern || 'off' }}"
          FB_ARG=""
          FB_VERIFY="--reject sweetfbtest=1"
          if [ "$FB_TEST" = "on" ]; then
            FB_ARG="sweetfbtest=1"
            FB_VERIFY="--require sweetfbtest=1"
          fi
          COMMON="$COMMON launchd_unsecure_cache=1 $FB_ARG"
          # Log mode: sweetlog=1 records every console character to the 4 MiB
          # ring on SYSTEM, cs_debug=2 prints the CD dump and the per-blob
          # line for every validated page (megabytes), and
          # -enable_kprintf_spam adds the rest. At 115200 baud that is the
          # biggest single cost in boot time, so none of it is in the normal
          # image.
          DIAG="sweetlog=1 cs_debug=2"
          SPAM="-enable_kprintf_spam"
          # Manual runs choose which image(s) to build; a push builds both.
          MODE="${{ inputs.build_mode || 'both' }}"
          # Console on the panel: hidden stops drawing it on the first GUI
          # swap (patch 0067), so the panel shows backboardd's IOSurfaces
          # instead of scrolling kprintf text. The ring keeps the text either
          # way, so a hidden-console boot is still diagnosable afterwards.
          if [ "${{ inputs.panel_console || 'text' }}" = hidden ]; then
            NOCONSOLE=1
          else
            NOCONSOLE=0
          fi

          mkdir -p images
          # suffix extra cmdline spam mute(1=keep the log off the panel)
          # noconsole(1=stop drawing the console over the GUI)
          build_mode() { # suffix extra spam mute noconsole
            rm -rf shim/out
            EXTRA_CMDLINE="$COMMON $2" KPRINTF_SPAM="$3" KPRINTF_MUTE="$4" \
              PANEL_NOCONSOLE="$5" bash shim/build.sh "$KERNEL"
            # First pass produces the uncompressed Image; whyred's ABL rejects a
            # single download over 6 MiB, and gzip -9 lands at ~6.31 MB, so
            # compress that Image with zopfli and pack it in a second pass.
            zopfli --i15 -c shim/out/Image > shim/out/Image.z.gz
            # build.sh cd's into shim/, so IMAGE_GZ must be absolute: a relative
            # path is re-resolved there, silently misses the file and the second
            # pass packs a gzip -9 Image (6.54 MB) - exactly the failure this
            # job exists to prevent.
            test -s shim/out/Image.z.gz
            EXTRA_CMDLINE="$COMMON $2" KPRINTF_SPAM="$3" KPRINTF_MUTE="$4" \
              PANEL_NOCONSOLE="$5" IMAGE_GZ="$PWD/shim/out/Image.z.gz" \
              bash shim/build.sh "$KERNEL"

            # The image only boots if the storage fixes and the ram-disk root
            # are in it: fail here instead of on the phone. bindfs must be in
            # the payload: without it mount-phase-1 gets ENODEV(19) on the
            # preboot bind mounts and launchd panics.
            for s in "mockfs" "sweet_hfs" "bindfs" "bus width from ABL kept"; do
              grep -aq "$s" shim/out/Image || { echo "::error::payload lacks '$s'"; exit 1; }
            done
            local size
            size=$(stat -c%s shim/out/shim-boot.img)
            echo "shim-boot$1.img = $size bytes (ABL limit 6291456)"
            test "$size" -le 6291456 || { echo "::error::boot image exceeds the ABL download limit"; exit 1; }
            cp shim/out/shim-boot.img "images/shim-boot$1.img"
          }

          case "$MODE" in
            both)   build_mode ""     ""     ""     1 "$NOCONSOLE"
                    build_mode "-log" "$DIAG" "$SPAM" 0 "$NOCONSOLE" ;;
            normal) build_mode ""     ""     ""     1 "$NOCONSOLE" ;;
            log)    build_mode "-log" "$DIAG" "$SPAM" 0 "$NOCONSOLE" ;;
            *)      echo "::error::unknown build_mode '$MODE'"; exit 1 ;;
          esac

          # Prove each image carries the command line it claims. The switches
          # that keep the unsealed iOS root alive are required in every image:
          # cs_enforcement_disable=1, unentitled_ios_sim_launch=1 and
          # launchd_unsecure_cache=1. The normal image must not carry the log
          # switches (sweetlog, cs_debug, kprintf spam); the log image must.
          for img in images/*.img; do
            python3 tools/payload_cmdline.py --image "$img" \
              --require rd=emmcroot0 --require emmcrw=1 \
              --require cs_enforcement_disable=1 \
              --require unentitled_ios_sim_launch=1 \
              --require launchd_unsecure_cache=1 $FB_VERIFY
            # ignition_level=<n> makes dyld's libignition search for the shared
            # cache somewhere our root does not have it: level 0 skips the
            # dyld_cache stage and level 1 searches System/Library/Caches/
            # com.apple.dyld instead of the cryptexes. Either way ignition
            # fails, the cache never maps and pid 1 dies with "no dyld cache".
            # The default level 0x5 is what reached SpringBoard in 0174-0178.
            python3 tools/payload_cmdline.py --image "$img" \
              --reject 'ignition_level='
            # The panel switch must match the run that was asked for; a
            # hidden-console image that still draws text looks exactly like
            # the bug it is meant to rule out.
            if [ "$NOCONSOLE" = 1 ]; then
              python3 tools/payload_cmdline.py --image "$img" \
                --require sweetfb_noconsole=1
            else
              python3 tools/payload_cmdline.py --image "$img" \
                --reject sweetfb_noconsole=1
            fi
          done
          if [ -f images/shim-boot.img ]; then
            echo "verifying the normal image carries no log capture"
            python3 tools/payload_cmdline.py --image images/shim-boot.img \
              --reject sweetlog=1 --reject cs_debug=2 \
              --reject=-enable_kprintf_spam
            # ...and keeps the boot log off the panel so the graphical boot
            # (and the Apple logo) stays visible.
            echo "verifying the normal image mutes the framebuffer console"
            python3 tools/payload_cmdline.py --image images/shim-boot.img \
              --require disable_kprintf_output=1 \
              --require sweetfb_stayon=1 --require sweetfb_hz=60
          fi
          if [ -f images/shim-boot-log.img ]; then
            echo "verifying the log image carries the ring and the dumps"
            python3 tools/payload_cmdline.py --image images/shim-boot-log.img \
              --require sweetlog=1 --require cs_debug=2 \
              --require=-enable_kprintf_spam
            # The diagnostic image must print: its whole point is the UART and
            # the ring, so it keeps today's command line exactly.
            echo "verifying the log image still prints everything"
            python3 tools/payload_cmdline.py --image images/shim-boot-log.img \
              --require disable_kprintf_output=0 \
              --reject sweetfb_stayon=1 --reject sweetfb_hz=60
          fi

      - name: Collect the flashable image
        run: |
          set -euo pipefail
          mkdir -p dist
          cp images/*.img dist/
          (cd dist && sha256sum *.img > SHA256SUMS)
          cat > dist/FLASH.txt <<'EOF'
          whyred (Redmi Note 5 / Note 5 Pro) iOS boot images
          ==================================================

          Every image loads the same XNU kernel from the kernel artifact of
          this CI run and continues from the iOS HFSX root on eMMC. They
          differ only in how much the kernel records.

          shim-boot.img      normal: no console ring, no cs_debug=2 page
                             dumps, no kprintf spam. The console still goes
                             to the UART. This is the image to boot daily.

          shim-boot-log.img  diagnostic: sweetlog=1 keeps a 4 MiB console
                             ring on SYSTEM, cs_debug=2 dumps every validated
                             code page and -enable_kprintf_spam adds the
                             rest. Several times slower at 115200 baud. Use
                             it when a line is missing, then pull the ring
                             from recovery with tools/sweet-log-pull.sh.

          A manual "Run workflow" chooses which of the two to build
          (build_mode: both / normal / log). A push builds both.

          Both draw four colour bars into the boot framebuffer once, early in
          BSD init (sweetfbtest=1), so a lit panel proves MDSS still scans the
          ABL splash out even while the console is on the UART.

          Flash to the recovery partition (slot a on this phone):

              fastboot flash recovery shim-boot.img
              fastboot reboot recovery

          Test without overwriting recovery:

              fastboot boot shim-boot.img
              fastboot boot shim-boot-log.img

          Verify before flashing:

              sha256sum -c SHA256SUMS
          EOF
          ls -l dist

      - name: Summary
        run: |
          {
            echo "### whyred boot image"
            echo
            echo "| file | size | sha256 |"
            echo "| --- | --- | --- |"
            for f in dist/*; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(stat -c%s "$f") B | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
            echo
            echo "Kernel zip: \`xnu-kernel\` artifact. Image zip: \`whyred-boot-img\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: whyred-boot-img
          path: dist/
          if-no-files-found: error
