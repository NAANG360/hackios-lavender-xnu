name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose XNU to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: Target machine profile (LAVENDER is the active bring-up target; SWEET is reference-only)
        type: choice
        options:
          - LAVENDER
          - SWEET
        default: LAVENDER
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, ci/lavender-machine-profile]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"
      - "tools/validate-lavender-profile.sh"

# Each run receives a unique group so concurrent dispatches cannot cancel builds.
concurrency:
  group: xnu-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'LAVENDER' }}

jobs:
  build:
    # macos-14 was retired Nov 2 2026. macos-15-intel is the supported x64 successor.
    # This image supplies Xcode 16.0; its iig ABI differs from Xcode 15, so this
    # first pass intentionally captures the resulting XNU 8796 compatibility diagnostics.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runner and select Xcode
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_16.0.app
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Fetch pinned XNU build tooling
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is arm64e-only upstream; the reference and Lavender
          # targets are plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Validate selected machine profile
        run: bash tools/validate-lavender-profile.sh "$MACHINE_CONFIG"

      - name: Install build dependencies
        run: |
          brew install jq gum bash cmake ninja
          # darwin-xnu-build checks for xcodes; Xcode is selected explicitly above.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes

      - name: Build XNU 8796
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: set -o pipefail; bash build.sh 2>&1 | tee ../xnu-build.log


      - name: Require Lavender XNU entry-guard patch
        if: success() && env.MACHINE_CONFIG == 'LAVENDER'
        run: |
          set -euo pipefail
          grep -q 'LAVENDER_XNU_GUARD_2026' dxb/xnu/osfmk/arm64/sweet_early.c
          python3 - <<'PY'
          from pathlib import Path
          source = Path("dxb/xnu/osfmk/arm64/start.s").read_text()
          start = source.index("LEXT(start_first_cpu)")
          vbar = source.index("MSR_VBAR_EL1_X0", start)
          pre_vbar = source[start:vbar]
          if "0x9d400000" in pre_vbar or "Llavender_stage1_pixel" in pre_vbar:
              raise SystemExit("unsafe Lavender framebuffer access remains before VBAR_EL1")
          if "lavender_early_mark 0x11" not in pre_vbar:
              raise SystemExit("missing RAM-only pre-VBAR checkpoint 0x11")
          print("PASS: pre-VBAR path has RAM-only markers and no framebuffer I/O")
          PY
          grep -q 'sweet_early_guard_init' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'sweet_early_map_final' dxb/xnu/osfmk/arm64/arm_vm_init.c
          grep -q 'sweet_early_logo' dxb/xnu/osfmk/arm64/sweet_early.c
          grep -q 'sweet_early_logo();' dxb/xnu/osfmk/arm/arm_init.c
          grep -q 'lavender_guard_mark 7' dxb/xnu/osfmk/arm64/start.s
          grep -q '#if !VMAPPLE && !defined(KERNEL_INTEGRITY_KTRR)' dxb/xnu/osfmk/arm64/start.s
          grep -q 'SPMI_OP_EXT_READL' shim/lavender_guardian.c
          grep -q 'QCOM_WDT_BASE 0x17817000' shim/lavender_guardian.c
          grep -q 'WDT0_BITE_TIME 0x14' shim/lavender_guardian.c

      - name: Upload XNU build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-log
          path: xnu-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package build tree for local compilation
        if: always()
        run: |
          if [[ -d dxb/build/xnu.obj && -d dxb/xnu && -d dxb/fakeroot/usr/local/include ]]; then
            SDK=$(xcrun --sdk macosx --show-sdk-path)
            mkdir -p sdk-kernel-platform
            cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
            tar czf buildtree.tgz \
              --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
              --exclude='kernel.development.*' --exclude='.git' \
              -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
              -C .. sdk-kernel-platform
            ls -lh buildtree.tgz
          else
            echo "No generated XNU tree exists; build failed before compilation, skipping build-tree package."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect closed KDK support libraries
        if: always()
        run: |
          mkdir -p out/kdk-libs
          : > out/kdk-libs/arch.txt
          shopt -s nullglob
          libs=(/Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a)
          for lib in "${libs[@]}"; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect kernel outputs
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          if [[ -s out/kernel.development.lavender ]]; then
            (cd out && shasum -a 256 kernel.development.lavender > SHA256SUMS)
          fi


      - name: Verify Lavender kernel artifact
        if: success()
        run: |
          set -euo pipefail
          kernel=out/kernel.development.lavender
          test -s "$kernel"
          file "$kernel" | tee out/KERNEL-VERIFICATION.txt
          python3 - "$kernel" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_bytes()
          if len(data) < 32:
              raise SystemExit("kernel is shorter than a Mach-O 64-bit header")
          magic, cputype, cpusubtype, filetype, ncmds, sizeofcmds, flags, reserved = struct.unpack_from("<IiiIIIII", data)
          if magic != 0xFEEDFACF:
              raise SystemExit(f"unexpected Mach-O magic: 0x{magic:08x}")
          if cputype != 0x0100000C:
              raise SystemExit(f"kernel is not ARM64 (cputype=0x{cputype:08x})")
          if filetype != 2:
              raise SystemExit(f"expected MH_EXECUTE (filetype={filetype})")
          required = (b"LavenderPlatformExpert", b"qcom,sdm660-mtp", b"Redmi Note 7")
          missing = [item.decode() for item in required if item not in data]
          if missing:
              raise SystemExit("missing Lavender identity strings: " + ", ".join(missing))
          result = (
              f"PASS: Mach-O 64-bit ARM64 executable; size={len(data)} bytes; "
              f"ncmds={ncmds}; flags=0x{flags:08x}; "
              "LavenderPlatformExpert, qcom,sdm660-mtp, Redmi Note 7 present"
          )
          print(result)
          Path("out/KERNEL-VERIFICATION.txt").write_text(result + "\\n", encoding="utf-8")
          PY
          shasum -a 256 "$kernel" | tee out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: error

  package:
    name: Package RAM-only Lavender fastboot image
    needs: build
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.machine_config == 'LAVENDER') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out matching source
        uses: actions/checkout@v4

      - name: Download XNU kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify Lavender Mach-O kernel exists
        run: |
          set -euo pipefail
          find out -maxdepth 2 -type f -printf '%p %s bytes\n'
          python3 - <<'PY'
          import os, struct
          from pathlib import Path
          candidates = sorted(
              (p for p in Path("out").rglob("kernel.development*") if p.is_file() and p.stat().st_size > 100_000),
              key=lambda p: (p.name != "kernel.development.lavender", str(p))
          )
          selected = None
          for candidate in candidates:
              header = candidate.read_bytes()[:8]
              if len(header) >= 8:
                  magic, cputype = struct.unpack("<II", header)
                  if magic == 0xfeedfacf and cputype == 0x0100000c:
                      selected = candidate.resolve()
                      break
          if selected is None:
              raise SystemExit("No 64-bit ARM Mach-O kernel found in xnu-kernel artifact")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"KERNEL_PATH={selected}\n")
          print(f"Selected ARM64 Mach-O kernel: {selected} ({selected.stat().st_size} bytes)")
          PY

      - name: Install AArch64 and Android image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install AOSP mkbootimg with GKI support
        run: |
          set -euo pipefail
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/aosp-mkbootimg"
          test -s "$RUNNER_TEMP/aosp-mkbootimg/mkbootimg.py"
          cat > "$RUNNER_TEMP/mkbootimg" <<'EOF'
          #!/usr/bin/env bash
          exec python3 "$AOSP_MKBOOTIMG_DIR/mkbootimg.py" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/mkbootimg"
          echo "AOSP_MKBOOTIMG_DIR=$RUNNER_TEMP/aosp-mkbootimg" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Download and verify published Lavender OTA
        env:
          OTA_URL: https://github.com/NAANG360/Lucid-OS/releases/download/lucid-android15-lavender-build-4/LucidOS-Android15-lavender-build-4-experimental.zip
          OTA_SHA256: d2b81388a57c685b82e3cb8f29da475f540dfcb9f5114003846d9337533d3219
        run: |
          set -euo pipefail
          mkdir -p stock
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 "$OTA_URL" -o stock/lucid-build4.zip
          echo "$OTA_SHA256  stock/lucid-build4.zip" | sha256sum -c -

      - name: Extract the exact stock boot image and DTB
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path("stock/lucid-build4.zip")
          with zipfile.ZipFile(archive) as z:
              candidates = [n for n in z.namelist() if PurePosixPath(n).name == "boot.img"]
              if len(candidates) != 1:
                  raise SystemExit(f"expected exactly one boot.img in OTA, found: {candidates}")
              member = candidates[0]
              z.extract(member, "stock/extracted")
              extracted = Path("stock/extracted") / member
              shutil.copyfile(extracted, "stock/boot.img")
              print(f"Extracted {member}: {Path('stock/boot.img').stat().st_size} bytes")
          PY
          python3 tools/unpack_bootv2.py stock/boot.img stock/unpacked
          python3 tools/extract_appended_fdt.py stock/unpacked/kernel --index 0 --compatible qcom,sdm660 --model-contains 'SDM 660' --output stock/unpacked/dtb
          test -s stock/unpacked/dtb
          python3 - <<'PY'
          import os, re, sys
          text = open("stock/unpacked/header.txt", encoding="utf-8").read()
          match = re.search(r"os_version: 0x([0-9a-fA-F]+)", text)
          value = int(match.group(1), 16) if match else 0
          major = (value >> 25) & 0x7f
          minor = (value >> 18) & 0x7f
          patch = (value >> 11) & 0x7f
          year = 2000 + ((value >> 4) & 0x7f)
          month = value & 0xf
          if 1 <= month <= 12:
              os_version = f"{major}.{minor}.{patch}"
              patch_level = f"{year}-{month:02d}"
          else:
              os_version, patch_level = "15.0.0", "2025-03"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"OS_VERSION={os_version}\n")
              env.write(f"OS_PATCH_LEVEL={patch_level}\n")
          print(f"Stock boot metadata: Android {os_version}, security patch {patch_level}", file=sys.stderr)
          PY

      - name: Generate and validate Lavender Apple Device Tree
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # XNU will enter on Kryo 260 Gold core MPIDR 0x100; keep the ADT boot CPU aligned.
          python3 tools/mkadt-lavender.py artifacts/lavender.adt --boot-mpidr 0x100 --check

      - name: Build the Lavender XNU payload
        run: |
          set -euo pipefail
          file "$KERNEL_PATH"
          python3 tools/mkpayload.py "$KERNEL_PATH" artifacts/lavender.adt artifacts/lavender-payload.bin \
            --machine LAVENDER \
            --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1'

      - name: Build non-flashing fastboot boot image
        env:
          TARGET: lavender
          DTB_PATH: ${{ github.workspace }}/stock/unpacked/dtb
        run: |
          set -euo pipefail
          bash shim/build.sh "$GITHUB_WORKSPACE/artifacts/lavender-payload.bin"
          test -s shim/out/shim-boot.img
          cp shim/out/shim-boot.img iosboot.img

      - name: Verify boot image structure and payload identity
        run: |
          set -euo pipefail
          python3 tools/unpack_bootv2.py shim/out/shim-boot.img artifacts/verify
          python3 - <<'PY'
          from pathlib import Path
          kernel = Path("artifacts/verify/kernel").read_bytes()
          payload = Path("artifacts/verify/ramdisk").read_bytes()
          dtb = Path("artifacts/verify/dtb").read_bytes()
          import re
          header = {}
          for line in Path("artifacts/verify/header.txt").read_text().splitlines():
              if ": " in line:
                  k, v = line.split(": ", 1)
                  header[k] = v
          assert kernel[0x38:0x3c] == b"ARMd", "shim is missing the ARM64 Image header"
          assert payload[:8] == b"LAVENDRX", "ramdisk does not contain a Lavender XNU payload"
          assert len(dtb) > 0, "stock DTB is missing"
          def hx(k): return int(header[k], 0)
          ranges = {
              "kernel": (hx("kernel_addr"), hx("kernel_addr") + len(kernel)),
              "ramdisk": (hx("ramdisk_addr"), hx("ramdisk_addr") + len(payload)),
              "dtb": (hx("dtb_addr"), hx("dtb_addr") + len(dtb)),
          }
          for name, (lo, hi) in ranges.items():
              assert lo >= 0 and hi > lo, f"invalid {name} load range: {lo:#x}..{hi:#x}"
          names = list(ranges)
          for i, a in enumerate(names):
              for b in names[i+1:]:
                  alo, ahi = ranges[a]; blo, bhi = ranges[b]
                  assert ahi <= blo or bhi <= alo, (
                      f"BOOT IMAGE LOAD OVERLAP: {a} [{alo:#x},{ahi:#x}) "
                      f"and {b} [{blo:#x},{bhi:#x})"
                  )
          assert hx("dtb_addr") % 0x1000 == 0, "DTB load address is not page-aligned"
          print("PASS: non-overlapping boot load ranges:")
          for name, (lo, hi) in ranges.items():
              print(f"  {name}: [{lo:#x}, {hi:#x}) ({hi-lo} bytes)")
          print(f"PASS: ARM64 shim={len(kernel)} bytes, LAVENDRX payload={len(payload)} bytes, DTB={len(dtb)} bytes")
          PY
          sha256sum "$KERNEL_PATH" shim/out/shim-boot.img artifacts/lavender-payload.bin artifacts/lavender.adt > artifacts/SHA256SUMS
          {
            echo "XNU workflow run: ${{ github.run_id }}"
            echo "Source commit: ${{ github.sha }}"
            echo "Boot mode: fastboot boot only; do not flash to a partition"
            echo "Recovery chord: Volume Up + Volume Down for 3 seconds (PMIC SPMI read path corrected; physical validation pending)"
            echo "Reset path: SDM660 watchdog bite at 0x17817000, then PSCI SYSTEM_RESET fallback"
            echo "Reset validation: watchdog/PSCI code compiled; physical reset still unverified"
            echo "XNU logo: drawn only after XNU reaches arm_init; no claim of full iOS boot"
            echo "Early watchdog: reset if XNU stage marker stalls for 60 seconds before stage 20"
            echo "Target: Redmi Note 7 / lavender / Qualcomm SDM660"
            echo "XNU boot CPU MPIDR: 0x100 (Kryo 260 Gold cluster)"
            echo "Android boot metadata: ${OS_VERSION} / ${OS_PATCH_LEVEL}"
            echo "Kernel: ${KERNEL_PATH}"
          } > artifacts/BUILD-MANIFEST.txt

      - name: Upload Lavender fastboot test image
        uses: actions/upload-artifact@v4
        with:
          name: lavender-fastboot-boot-test
          path: |
            shim/out/shim-boot.img
            iosboot.img
            artifacts/lavender-payload.bin
            artifacts/lavender.adt
            artifacts/SHA256SUMS
            artifacts/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
