name: Audit Build 4 Lavender storage FDT

on:
  workflow_dispatch:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/audit-lavender-storage.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Device Tree Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Range-extract Build 4 boot image and inspect its embedded FDT
        shell: bash
        run: |
          set -euo pipefail
          OTA_URL="https://github.com/NAANG360/Lucid-OS/releases/download/lucid-android15-lavender-build-4/LucidOS-Android15-lavender-build-4-experimental.zip"
          EXPECTED_OTA_SHA256="d2b81388a57c685b82e3cb8f29da475f540dfcb9f5114003846d9337533d3219"
          EXPECTED_OTA_SIZE="1355867286"
          mkdir -p artifacts/storage/ota artifacts/storage/unpacked

          printf 'OTA URL: %s\nExpected whole-archive SHA-256: %s\nExpected size: %s\n' "$OTA_URL" "$EXPECTED_OTA_SHA256" "$EXPECTED_OTA_SIZE" > artifacts/storage/source.txt
          python3 tools/remotezip.py "$OTA_URL" > artifacts/storage/ota-members.txt
          grep -E '[[:space:]/]boot\.img$' artifacts/storage/ota-members.txt > artifacts/storage/boot-members.txt
          test -s artifacts/storage/boot-members.txt
          python3 tools/remotezip.py "$OTA_URL" boot.img artifacts/storage/ota

          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("artifacts/storage/ota").rglob("boot.img"))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one boot.img member, found {len(matches)}: {matches}")
          print(f"Selected OTA boot image: {matches[0]} ({matches[0].stat().st_size} bytes)")
          PY

          BOOT_IMAGE="$(find artifacts/storage/ota -type f -name boot.img -print -quit)"
          sha256sum "$BOOT_IMAGE" > artifacts/storage/boot-img.sha256
          python3 tools/unpack_bootv2.py "$BOOT_IMAGE" artifacts/storage/unpacked
          python3 tools/extract_appended_fdt.py artifacts/storage/unpacked/kernel --index 0 --compatible qcom,sdm660 --model-contains "SDM 660" --output artifacts/storage/lavender.dtb
          dtc -I dtb -O dts -o artifacts/storage/lavender.dts artifacts/storage/lavender.dtb 2> artifacts/storage/dtc-warnings.txt

          python3 - <<'PY'
          from pathlib import Path
          lines = Path("artifacts/storage/lavender.dts").read_text(errors="replace").splitlines()
          out = []
          for address in ("c084000", "c0c4000"):
              hits = [i for i, line in enumerate(lines) if address in line]
              out.append(f"===== address {address}: {'PRESENT' if hits else 'ABSENT'} =====")
              if hits:
                  for i in hits[:3]:
                      out.extend(lines[max(0, i-3):min(len(lines), i+55)])
              out.append("")
          Path("artifacts/storage/storage-audit.txt").write_text("\n".join(out) + "\n")
          print(Path("artifacts/storage/storage-audit.txt").read_text())
          PY

          sha256sum artifacts/storage/lavender.dtb artifacts/storage/lavender.dts >> artifacts/storage/source.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavender-build4-storage-fdt-audit
          path: artifacts/storage/
          if-no-files-found: warn
          retention-days: 14
