name: Extract genuine iPhone X AppleLogo

on:
  workflow_dispatch:
  push:
    branches: [ci/lavender-machine-profile]
    paths:
      - ".github/workflows/audit-post-logo-assets.yml"

permissions:
  contents: read

jobs:
  extract-applelogo:
    name: Extract iPhone X 20H392 AppleLogo
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned IPSW CLI release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="3.1.748"
          ASSET="ipsw_${VERSION}_macOS_x86_64.tar.gz"
          BASE="https://github.com/blacktop/ipsw/releases/download/v${VERSION}"
          mkdir -p "$HOME/bin" artifacts/applelogo/source artifacts/applelogo/decoded artifacts/applelogo/logs
          curl -fL --retry 4 --retry-delay 3 "$BASE/checksums.txt" -o artifacts/applelogo/source/ipsw-checksums.txt
          curl -fL --retry 4 --retry-delay 3 "$BASE/$ASSET" -o "artifacts/applelogo/source/$ASSET"
          EXPECTED="$(awk -v name="$ASSET" '$2 == name {print $1}' artifacts/applelogo/source/ipsw-checksums.txt)"
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "artifacts/applelogo/source/$ASSET" | shasum -a 256 -c -
          tar -xzf "artifacts/applelogo/source/$ASSET" -C "$HOME/bin"
          chmod +x "$HOME/bin/ipsw"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/ipsw" version | tee artifacts/applelogo/logs/ipsw-version.txt
          "$HOME/bin/ipsw" fw ibootim --help > artifacts/applelogo/logs/ibootim-help.txt

      - name: Decode the AppleLogo resource from the exact 20H392 IPSW
        shell: bash
        run: |
          set -euo pipefail
          IPSW_URL="https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          EXPECTED_SHA256="ece1194f7e233e9109c5790a8d23a4564a10a254e15ec5b09978a343265568fb"
          printf 'Device: iPhone10,3 / iPhone X Global\nBuild: iOS 16.7.16 (20H392)\nIPSW URL: %s\nExpected whole IPSW SHA-256: %s\n' "$IPSW_URL" "$EXPECTED_SHA256" > artifacts/applelogo/source/firmware-source.txt
          # ipsw's remote IPSW reader retrieves only firmware components it needs;
          # do not download the 5.7 GiB full restore archive to the runner.
          ipsw fw ibootim --remote "$IPSW_URL" --info --output artifacts/applelogo/decoded 2>&1 | tee artifacts/applelogo/logs/ibootim-remote.log
          find artifacts/applelogo/decoded -type f -print | sort > artifacts/applelogo/file-index.txt
          find artifacts/applelogo/decoded -type f -exec file {} \; > artifacts/applelogo/decoded/file-types.txt
          find artifacts/applelogo/decoded -type f -exec shasum -a 256 {} \; > artifacts/applelogo/decoded/member-sha256.txt
          test -s artifacts/applelogo/file-index.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-x-20h392-applelogo-extraction
          path: artifacts/applelogo/
          if-no-files-found: warn
          retention-days: 14
